<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workflow Monitor</title>
  <style>
    /* 监控首页(单流水线架构 2026-11-04,阶段1;2026-11-06 迁入历史任务与清除缓存维护入口)。
       订阅/断开/刷新只走 /api/workflow/* 只读 GET,绝不触发或恢复工作流;
       取消/恢复/清除缓存/删除走 /api/console/* 显式确认后的 POST(带 CSRF)。 */
    :root{
      --bg:#0f0f0f; --panel:#171717; --text:#eaeaea; --muted:#b5b5b5;
      --border:#2c2c2c; --st-run:#3b82f6; --st-done:#22c55e; --st-wait:#d97706;
      --st-retry:#f97316; --st-fail:#ef4444;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* 硬编码深色收敛(主题切换用,命名对齐 node_map.html) */
      --topbar-bg: linear-gradient(to bottom, #121212, #0f0f0f);
      --input-bg:#0f0f0f;
      --chip-bg:#141414;
      --hover-border:#3a3a3a;
      --hover-bg:#141414;
      --table-row-border:#242424;
      --link-text:#93c5fd;
      --err-text:#fca5a5;
      --chip-run-text:#93c5fd;
      --chip-wait-text:#fcd34d;
      --chip-done-text:#86efac;
      --chip-fail-text:#fca5a5;
    }
    /* 浅色主题:html[data-theme="light"] 时整体覆盖(默认深色保持现状) */
    html[data-theme="light"]{
      --bg:#ffffff; --panel:#ffffff; --text:#1a1a1a; --muted:#525252;
      --border:#d4d4d4;
      --topbar-bg: linear-gradient(to bottom, #ffffff, #fafafa);
      --input-bg:#ffffff;
      --chip-bg:#f5f5f5;
      --hover-border:#a3a3a3;
      --hover-bg:#f0f0f0;
      --table-row-border:#e5e5e5;
      --link-text:#1d4ed8;
      --err-text:#b91c1c;
      --chip-run-text:#1d4ed8;
      --chip-wait-text:#92400e;
      --chip-done-text:#15803d;
      --chip-fail-text:#b91c1c;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13px; }
    #topbar{
      height:52px; display:flex; align-items:center; gap:10px; padding:0 14px;
      border-bottom:1px solid var(--border); background:var(--topbar-bg);
    }
    #topbar h1{ font-size:14px; margin:0 10px 0 0; font-weight:650; white-space:nowrap; }
    #topbar a{ color:var(--link-text); font-size:12px; text-decoration:none; border:1px solid var(--border); border-radius:8px; padding:5px 8px; }
    .btn{
      appearance:none; background:transparent; color:var(--text); border:1px solid var(--border);
      border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer;
    }
    .btn:hover:not(:disabled){ border-color:var(--hover-border); background:var(--hover-bg); }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }
    .btn.primary{ border-color:var(--st-run); color:var(--chip-run-text); font-weight:600; }
    #threadInput{
      background:var(--input-bg); border:1px solid var(--border); color:var(--text);
      border-radius:8px; padding:6px 8px; font-size:12px; font-family:var(--mono); width:240px;
    }
    #chip{
      display:inline-block; padding:3px 9px; border-radius:999px; border:1px solid var(--border);
      background:var(--chip-bg); font-family:var(--mono); font-size:11px; color:var(--muted);
    }
    #chip.s-running{ color:var(--chip-run-text); border-color:var(--st-run); }
    #chip.s-waiting_human{ color:var(--chip-wait-text); border-color:var(--st-wait); }
    #chip.s-completed{ color:var(--chip-done-text); border-color:var(--st-done); }
    #chip.s-failed{ color:var(--chip-fail-text); border-color:var(--st-fail); }
    #counts,#meta{ font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #meta.err{ color:var(--err-text); }
    #layout{ display:flex; height:calc(100vh - 53px); }
    #left{ flex:1.4; display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--border); }
    #history{ flex:0 0 auto; border-bottom:1px solid var(--border); padding-bottom:8px; }
    #historyWrap{ max-height:260px; overflow:auto; }
    #nodes{ flex:1; overflow:auto; padding:10px; }
    h2{ font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin:10px 10px 6px; font-weight:650; }
    table{ width:calc(100% - 20px); margin:0 10px 10px; border-collapse:collapse; font-family:var(--mono); font-size:11px; }
    th{ text-align:left; color:var(--muted); border-bottom:1px solid var(--border); padding:5px 8px; position:sticky; top:0; background:var(--bg); }
    td{ border-bottom:1px solid var(--table-row-border); padding:5px 8px; vertical-align:top; word-break:break-all; }
    /* 行内订阅标记:当前 SSE 订阅行 thread_id 单元格左侧色条(--st-run 双主题均定义) */
    #historyTable tr.live-row td:first-child{ box-shadow: inset 3px 0 0 var(--st-run); }
    .st{ display:inline-block; padding:1px 7px; border-radius:999px; border:1px solid var(--border); font-size:10px; }
    .st.running{ color:var(--chip-run-text); border-color:var(--st-run); }
    .st.done{ color:var(--chip-done-text); border-color:var(--st-done); }
    .st.waiting{ color:var(--chip-wait-text); border-color:var(--st-wait); }
    .st.retrying{ color:var(--chip-wait-text); border-color:var(--st-retry); }
    .st.failed{ color:var(--chip-fail-text); border-color:var(--st-fail); }
    .hint{ color:var(--muted); font-size:11px; margin:8px 10px; }
    #nodeEmpty{ color:var(--muted); font-style:italic; font-size:11px; margin:8px 10px; }
    /* 参数行 / 恢复面板(自创建台迁移,2026-11-06) */
    .params{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; padding:0 10px; }
    .params label{ display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--muted); }
    .params input{
      background:var(--input-bg); border:1px solid var(--border); color:var(--text);
      border-radius:8px; padding:6px 8px; font-size:12px; font-family:var(--mono); width:110px;
    }
    #resumeBox{
      display:none; border:1px solid var(--st-wait); border-radius:10px; padding:10px 12px; margin:8px 10px;
      font-size:12px; color:var(--chip-wait-text);
    }
    #resumeBox.active{ display:block; }
  </style>
  <script>
    /* 主题预置:首帧前应用上次选择的背景主题,避免闪烁 */
    try{
      if(localStorage.getItem("wf_monitor_theme") === "light"){
        document.documentElement.dataset.theme = "light";
      }
    }catch(e){}
  </script>
</head>
<body>
  <div id="topbar">
    <h1>Workflow Monitor</h1>
    <input id="threadInput" spellcheck="false" placeholder="thread_id,如 video-wiring-001" />
    <span id="chip">未连接</span>
    <span id="counts"></span>
    <span id="meta"></span>
    <a href="/console" style="margin-left:auto">创建任务 →</a>
    <a href="/node-map">节点图视图 →</a>
    <button class="btn" id="btnTheme" title="切换背景颜色(白/黑)">背景:白色</button>
  </div>
  <div id="layout">
    <div id="left">
      <div id="history">
        <h2>历史任务</h2>
        <div class="params">
          <label>搜索(thread_id / 状态 / 时间)<input id="historySearch" spellcheck="false" style="width:220px" /></label>
          <button class="btn" id="btnHistoryRefresh">刷新</button>
          <button class="btn" id="btnCleanCache" title="清除可再生缓存(临时目录 / __pycache__ / 日志 / 剪映草稿备份等)。不影响 outputs/ 成片、任务记录与剪映 User Data\Cache\Log。">清除缓存</button>
        </div>
        <div id="historyWrap">
          <table id="historyTable">
            <thead><tr><th>thread_id</th><th style="width:140px">创建时间</th><th style="width:110px">状态</th><th style="width:180px">操作</th></tr></thead>
            <tbody id="historyBody"><tr><td colspan="4" class="hint">—</td></tr></tbody>
          </table>
        </div>
        <div class="hint">订阅/断开/刷新均为只读 GET,绝不触发或恢复工作流;取消/恢复/清除缓存/删除为历史任务区内显式确认后的 POST(删除仅限终态/未启动任务,含成片,不可恢复)。</div>
      </div>
    </div>
    <div id="nodes">
      <div id="resumeBox">
        <div id="resumeText"></div>
        <div class="params" style="margin-top:8px">
          <label>关卡(留空=唯一挂起时自动匹配)<input id="resumeCheckpoint" spellcheck="false" placeholder="① / ② / ③" /></label>
          <label>放行值(JSON,默认 true)<input id="resumeValue" spellcheck="false" value="true" /></label>
          <button class="btn primary" id="btnResume">确认恢复</button>
        </div>
        <div class="hint" id="resumeErr"></div>
      </div>
      <h2>节点状态</h2>
      <div id="nodeEmpty">—(订阅后显示)</div>
      <table id="ndTable" style="display:none">
        <thead><tr><th>node</th><th style="width:90px">状态</th><th style="width:56px">attempt</th></tr></thead>
        <tbody id="ndBody"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import {
      API_PATHS, applyEvent, createMonitorState, computeCounts,
    } from "/static/workflow_monitor.mjs";
    import {
      CONSOLE_API_PATHS, friendlyError, HISTORY_STATE_LABEL,
      canResume, canCancel, canDelete, filterHistoryRows, parseResumeValue,
    } from "/static/workflow_console.mjs";

    const EVENT_TYPES = [
      "snapshot", "store_error",
      "run.started", "run.resumed", "run.interrupted", "run.completed", "run.failed",
      "node.started", "node.succeeded", "node.failed", "node.waiting_input",
      "node.resumed", "node.retrying", "node.progress", "branch.selected",
    ];
    const STATE_LABEL = {
      no_events: "无事件", idle: "空闲", running: "运行中",
      waiting_human: "等待人工操作", completed: "已完成", failed: "失败",
    };
    const NODE_ST_LABEL = {
      running: "执行中", done: "已完成", waiting: "等待人工",
      retrying: "重试中", failed: "失败",
    };

    const $ = (id) => document.getElementById(id);
    const chip = $("chip"), counts = $("counts"), meta = $("meta");
    const ndBody = $("ndBody"), ndTable = $("ndTable"), nodeEmpty = $("nodeEmpty");
    const threadInput = $("threadInput");
    const historySearch = $("historySearch"), btnHistoryRefresh = $("btnHistoryRefresh");
    const btnCleanCache = $("btnCleanCache"), historyBody = $("historyBody");
    const resumeBox = $("resumeBox"), resumeText = $("resumeText");
    const resumeCheckpoint = $("resumeCheckpoint"), resumeValue = $("resumeValue");
    const btnResume = $("btnResume"), resumeErr = $("resumeErr");

    let monitor = createMonitorState();
    let source = null;
    let liveThreadId = null;  // 当前 SSE 订阅的 thread;行内订阅/断开按钮与取消/删除联动以此为准
    let csrfToken = null;
    let resumeGuidanceShown = false;
    let historyRows = [];
    let NODE_NAMES = {};  // node_id -> 中文显示名(与节点图视图同一事实源;未收录回退英文 id)

    try { threadInput.value = localStorage.getItem("wf_monitor_thread") || ""; } catch (e) {}

    // 阶段 3:支持 /?thread_id=<id> 初始化输入框并自动订阅(创建台创建成功后跳转而来)。
    // 参数保留在 URL 中:刷新后仍按该 thread_id 重连,配合 Last-Event-ID 继续补发。
    // 无参数时保持现状(localStorage 回退 + 行内订阅按钮 / 输入框回车)。
    {
      const urlTid = new URLSearchParams(location.search).get("thread_id");
      if (urlTid && urlTid.trim()) {
        threadInput.value = urlTid.trim();
        subscribe();
      }
    }

    // 节点状态面板的中文显示名映射:非阻塞拉取,拿到后重渲染一次(处理节点
    // 快照先于映射到达的时序);失败静默,未收录的节点回退显示英文 id。
    (async () => {
      try {
        const r = await fetch(API_PATHS.nodeNames, { headers: { Accept: "application/json" } });
        if (!r.ok) return;
        const data = await r.json();
        if (data && data.names && typeof data.names === "object") {
          NODE_NAMES = data.names;
          renderNodes();
        }
      } catch (e) { /* 映射不可用时保持英文 id */ }
    })();

    function setChip(stateKey, extra) {
      chip.className = "s-" + (stateKey || "");
      chip.textContent = (STATE_LABEL[stateKey] || stateKey || "未连接") + (extra ? ` · ${extra}` : "");
    }
    function renderMeta(text, isErr) {
      meta.textContent = text || "";
      meta.classList.toggle("err", !!isErr);
    }
    function renderCounts() {
      const c = computeCounts(monitor);
      counts.textContent = Object.keys(monitor.nodes).length
        ? `完成 ${c.done} · 执行中 ${c.running} · 等待 ${c.waiting} · 失败 ${c.failed}` : "";
    }
    function renderNodes() {
      const ids = Object.keys(monitor.nodes);
      if (!ids.length) { ndTable.style.display = "none"; nodeEmpty.style.display = ""; return; }
      ndTable.style.display = ""; nodeEmpty.style.display = "none";
      ndBody.innerHTML = "";
      for (const id of ids.sort()) {
        const n = monitor.nodes[id];
        const label = NODE_ST_LABEL[n.status] || n.status || "—";
        const name = NODE_NAMES[id] || id;
        ndBody.insertAdjacentHTML("beforeend",
          `<tr><td>${escapeHtml(name)}</td><td><span class="st ${n.status || ""}">${label}</span></td><td>${n.attempt || 1}</td></tr>`);
      }
    }
    function handleEvent(esEvent) {
      let data = {};
      try { data = JSON.parse(esEvent.data); } catch (e) { return; }
      const event = {
        id: esEvent.lastEventId ? Number(esEvent.lastEventId) : null,
        event_type: esEvent.type,
        ...data,
      };
      if (esEvent.type === "snapshot") {
        setChip(data.state || "idle", `count=${data.event_count ?? "?"}`);
        renderMeta(`thread=${data.thread_id || "-"} · cursor=${data.last_id ?? "-"}`);
        return;
      }
      if (esEvent.type === "store_error") {
        setChip("failed", "事件存储不可用");
        renderMeta(String(data.detail || "event store unavailable"), true);
        return;
      }
      const { applied } = applyEvent(monitor, event);
      if (!applied) return;
      setChip(monitor.run.state, monitor.cursor ? `#${monitor.cursor}` : "");
      renderCounts();
      renderNodes();
      const st = monitor.run.state;
      if (st === "waiting_human" && !resumeGuidanceShown) {
        resumeGuidanceShown = true;
        showResumePanel();
      } else if (st === "running" && resumeGuidanceShown) {
        resumeGuidanceShown = false;
        resumeBox.classList.remove("active");
      } else if (st === "completed" || st === "failed") {
        resumeBox.classList.remove("active");
        loadHistory();  // 终态后刷新历史任务状态列
      }
    }
    function subscribe() {
      const tid = (threadInput.value || "").trim();
      if (!tid) { renderMeta("请输入 thread_id", true); return; }
      if (source) source.close();
      try { localStorage.setItem("wf_monitor_thread", tid); } catch (e) {}
      monitor = createMonitorState();
      resumeGuidanceShown = false;
      resumeBox.classList.remove("active");
      renderNodes(); renderCounts();
      setChip("running", "连接中…");
      renderMeta(`thread=${tid}`);
      source = new EventSource(API_PATHS.runEvents(tid));
      for (const t of EVENT_TYPES) source.addEventListener(t, handleEvent);
      source.onopen = () => setChip(monitor.run.state || "running", "已连接");
      source.onerror = () => setChip(monitor.run.state || "idle", "重连中…");
      liveThreadId = tid;
      renderHistory();  // 行内按钮切换为「断开」并标记已订阅行
    }
    // 断开当前 SSE 订阅(原顶栏「断开」按钮,2026-11-07 迁移为历史任务行内按钮)
    function disconnect() {
      if (source) { source.close(); source = null; }
      liveThreadId = null;
      setChip("idle", "已断开");
      renderHistory();  // 行内按钮还原为「订阅」
    }
    threadInput.addEventListener("keydown", (e) => { if (e.key === "Enter") subscribe(); });

    // 背景主题切换:黑色(默认) <-> 白色,经 localStorage 记忆;按钮文案显示点击后切到的目标主题
    const btnTheme = $("btnTheme");
    function applyThemeButton(){
      btnTheme.textContent = document.documentElement.dataset.theme === "light" ? "背景:黑色" : "背景:白色";
    }
    applyThemeButton();
    btnTheme.addEventListener("click", () => {
      const toLight = document.documentElement.dataset.theme !== "light";
      if(toLight){ document.documentElement.dataset.theme = "light"; }
      else{ delete document.documentElement.dataset.theme; }
      try{ localStorage.setItem("wf_monitor_theme", toLight ? "light" : "dark"); }catch(e){}
      applyThemeButton();
    });

    // ------------------------------------------------------------------
    // 历史任务列表(自创建台迁移;状态经服务端调和,搜索为客户端过滤)
    // ------------------------------------------------------------------
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }
    async function loadHistory() {
      try {
        const r = await fetch(`${CONSOLE_API_PATHS.listRuns}?limit=50`, { headers: { Accept: "application/json" } });
        if (!r.ok) return;
        const data = await r.json();
        historyRows = Array.isArray(data.runs) ? data.runs : [];
      } catch (e) { return; }
      renderHistory();
    }
    function renderHistory() {
      const rows = filterHistoryRows(historyRows, historySearch.value);
      historyBody.innerHTML = "";
      if (!rows.length) {
        historyBody.innerHTML = `<tr><td colspan="4" class="hint">${historyRows.length ? "无匹配任务" : "暂无任务"}</td></tr>`;
        return;
      }
      for (const row of rows) {
        const tr = document.createElement("tr");
        const isLive = !!source && row.thread_id === liveThreadId;
        if (isLive) tr.classList.add("live-row");
        const label = HISTORY_STATE_LABEL[row.state] || row.state || "—";
        const created = typeof row.created_at === "string" ? row.created_at.replace("T", " ").slice(0, 19) : "—";
        tr.innerHTML =
          `<td>${escapeHtml(row.thread_id || "—")}</td>` +
          `<td>${escapeHtml(created)}</td>` +
          `<td>${escapeHtml(label)}</td>`;
        const tdOp = document.createElement("td");
        const actions = [];
        const mkBtn = (text, fn) => {
          const b = document.createElement("button");
          b.className = "btn";
          b.style.padding = "2px 8px";
          b.textContent = text;
          b.addEventListener("click", fn);
          return b;
        };
        // 查看 = 跳转创建台查看模式(?thread_id= 与本页 227 行参数契约一致)
        actions.push(mkBtn("查看", () => {
          window.location.href = "/console?thread_id=" + encodeURIComponent(row.thread_id);
        }));
        // 行内订阅/断开(自顶栏迁移,2026-11-07):订阅 = 把 SSE 切到该行;断开 = 关闭当前订阅
        if (isLive) {
          actions.push(mkBtn("断开", disconnect));
        } else {
          actions.push(mkBtn("订阅", () => {
            threadInput.value = row.thread_id;
            subscribe();
          }));
        }
        if (canResume(row.state)) {
          actions.push(mkBtn("恢复", () => {
            threadInput.value = row.thread_id;
            subscribe();
            resumeCheckpoint.value = "";
            showResumePanel();
          }));
        }
        if (canCancel(row.state)) {
          actions.push(mkBtn("取消", async () => {
            if (!window.confirm(`确认取消运行 ${row.thread_id}?`)) return;
            try {
              await postJson(CONSOLE_API_PATHS.cancelRun(row.thread_id), {});
              loadHistory();
              if (liveThreadId === row.thread_id) {  // 以真实订阅为准(输入框可能已被手改)
                setChip("failed", "已取消");
                monitor.run.state = "failed"; // 停止等事件;终态以取消记录为准
              }
            } catch (err) {
              window.alert(`取消失败:${err && err.message ? err.message : ""}`);
            }
          }));
        }
        if (canDelete(row.state)) {
          actions.push(mkBtn("删除", async () => {
            if (!window.confirm(`确认删除任务 ${row.thread_id}?将删除任务目录(含成片输出)与事件记录,不可恢复。`)) return;
            if (liveThreadId === row.thread_id) disconnect();  // fail-safe:不留指向已删任务的 SSE
            try {
              await postJson(CONSOLE_API_PATHS.deleteRun(row.thread_id), {});
              loadHistory();
            } catch (err) {
              window.alert(`删除失败:${err && err.message ? err.message : ""}`);
            }
          }));
        }
        for (const b of actions) { tdOp.appendChild(b); tdOp.appendChild(document.createTextNode(" ")); }
        tr.appendChild(tdOp);
        historyBody.appendChild(tr);
      }
    }
    historySearch.addEventListener("input", renderHistory);
    btnHistoryRefresh.addEventListener("click", loadHistory);

    // ------------------------------------------------------------------
    // 清除可再生缓存(维护入口;服务端有冷却限流与活跃任务 409)
    // ------------------------------------------------------------------
    btnCleanCache.addEventListener("click", async () => {
      if (btnCleanCache.disabled) return;
      if (!window.confirm(
        "确认清除可再生缓存?(临时目录 / __pycache__ / 日志 / 剪映草稿备份等;"
        + "不影响 outputs/ 成片与任务记录)"
      )) return;
      btnCleanCache.disabled = true;
      try {
        const data = await postJson(CONSOLE_API_PATHS.clearCache, {});
        const n = Number(data.cleaned_count || 0);
        const errs = Array.isArray(data.errors) ? data.errors.length : 0;
        window.alert(errs ? `已清理 ${n} 个路径,${errs} 项失败(多为被占用的日志/缓存,可稍后再试)` : `已清理 ${n} 个缓存路径`);
        loadHistory();
      } catch (err) {
        window.alert(`清除缓存失败:${err && err.message ? err.message : ""}`);
      } finally {
        btnCleanCache.disabled = false;
      }
    });

    // ------------------------------------------------------------------
    // CSRF + 写请求(取消/恢复/清除缓存共用;token 同源获取)
    // ------------------------------------------------------------------
    async function ensureCsrf() {
      if (csrfToken) return csrfToken;
      const r = await fetch(CONSOLE_API_PATHS.csrf, { headers: { Accept: "application/json" } });
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        throw { status: r.status, detail: String(data.detail || "无法获取 CSRF token") };
      }
      const data = await r.json();
      csrfToken = data.token;
      return csrfToken;
    }
    async function postJson(url, body) {
      const token = await ensureCsrf();
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRF-Token": token, Accept: "application/json" },
        body: JSON.stringify(body || {}),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw friendlyError(r.status, String(data.detail || r.statusText || ""));
      return data;
    }

    // ------------------------------------------------------------------
    // 人工关卡恢复面板(waiting_human 是正常状态;确认后由服务端恢复)
    // ------------------------------------------------------------------
    async function showResumePanel() {
      const tid = (threadInput.value || "").trim();
      if (!tid) return;
      resumeText.textContent = "工作流已暂停在人工关卡,等待人工处理(正常状态,不是失败)。";
      resumeErr.textContent = "";
      resumeBox.classList.add("active");
      try {
        const r = await fetch(CONSOLE_API_PATHS.resumeStatus(tid), { headers: { Accept: "application/json" } });
        if (r.ok) {
          const data = await r.json();
          const node = data.last_event && data.last_event.node_id ? `(${data.last_event.node_id})` : "";
          resumeText.textContent =
            `工作流已暂停在人工关卡${node},等待人工处理(正常状态,不是失败)。` +
            `确认后由服务端以 scripts/resume_workflow.py 恢复(入口 A 同款语义)。`;
        }
      } catch (e) { /* 指引获取失败不影响面板可用性 */ }
    }
    btnResume.addEventListener("click", async () => {
      const tid = (threadInput.value || "").trim();
      if (!tid) { resumeErr.textContent = "请先订阅一个任务"; return; }
      const parsed = parseResumeValue(resumeValue.value);
      if (!parsed.ok) { resumeErr.textContent = parsed.error; return; }
      btnResume.disabled = true;
      resumeErr.textContent = "";
      try {
        await postJson(CONSOLE_API_PATHS.resumeRun(tid), {
          checkpoint: resumeCheckpoint.value.trim() || null,
          value: parsed.value,
        });
        resumeBox.classList.remove("active");
        resumeGuidanceShown = false;
        renderMeta("恢复已提交,等待执行事件…");
        loadHistory();
      } catch (err) {
        resumeErr.textContent = err && err.message ? err.message : "恢复提交失败";
      } finally {
        btnResume.disabled = false;
      }
    });

    // 页面就绪即展示历史任务
    loadHistory();
  </script>
</body>
</html>

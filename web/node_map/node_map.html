<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workflow Node Map</title>
  <style>
    :root{
      --bg:#0f0f0f;
      --panel:#171717;
      --panel2:#1f1f1f;
      --text:#eaeaea;
      --muted:#b5b5b5;
      --border:#2c2c2c;
      --edge:#8a8a8a;
      --edge-muted:#3f3f3f;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      /* 状态色(§4.1 七态) */
      --st-run:#3b82f6;      /* 执行中:蓝 */
      --st-done:#22c55e;     /* 已完成:绿 */
      --st-wait:#d97706;     /* 等待人工/网页:琥珀 */
      --st-retry:#f97316;    /* 重试中:橙 */
      --st-fail:#ef4444;     /* 失败:红 */
      --st-skip:#525252;     /* 跳过/未参与:灰 */
      /* 硬编码深色收敛(主题切换用) */
      --topbar-bg: linear-gradient(to bottom, #121212, #0f0f0f);
      --runbar-bg:#131313;
      --input-bg:#0f0f0f;
      --chip-bg:#141414;
      --hover-border:#3a3a3a;
      --hover-bg:#141414;
      --kv-bg:#121212;
      --table-row-border:#242424;
      --dot-bg:#242424;
      --skip-bg:#2a2a2a;
      --skip-border:#3f3f3f;
      --section-dash:#2e2e2e;
      --node-drag-border:#4a4a4a;
      --offline-border:#333;
      --err-text:#fca5a5;
      --err-border:#7f1d1d;
      --err-bg:#1c1212;
      --wait-text:#fcd34d;
      --wait-border:#78350f;
      --wait-bg:#1b1408;
      --chip-run-text:#93c5fd;
      --chip-wait-text:#fcd34d;
      --chip-done-text:#86efac;
      --chip-fail-text:#fca5a5;
      --edge-traversed:#4ade80;
      --edge-active:#38bdf8;
    }
    /* 浅色主题:html[data-theme="light"] 时整体覆盖(默认深色保持现状) */
    html[data-theme="light"]{
      --bg:#ffffff;
      --panel:#ffffff;
      --panel2:#f5f5f5;
      --text:#1a1a1a;
      --muted:#525252;
      --border:#d4d4d4;
      --edge:#6b7280;
      --edge-muted:#d4d4d4;
      --shadow: 0 10px 30px rgba(0,0,0,.12);
      --topbar-bg: linear-gradient(to bottom, #ffffff, #fafafa);
      --runbar-bg:#f5f5f5;
      --input-bg:#ffffff;
      --chip-bg:#f5f5f5;
      --hover-border:#a3a3a3;
      --hover-bg:#f0f0f0;
      --kv-bg:#f5f5f5;
      --table-row-border:#e5e5e5;
      --dot-bg:#e5e5e5;
      --skip-bg:#e5e5e5;
      --skip-border:#a3a3a3;
      --section-dash:#d4d4d4;
      --node-drag-border:#8a8a8a;
      --offline-border:#b3b3b3;
      --err-text:#b91c1c;
      --err-border:#fecaca;
      --err-bg:#fef2f2;
      --wait-text:#92400e;
      --wait-border:#fde68a;
      --wait-bg:#fffbeb;
      --chip-run-text:#1d4ed8;
      --chip-wait-text:#92400e;
      --chip-done-text:#15803d;
      --chip-fail-text:#b91c1c;
      --edge-traversed:#16a34a;
      --edge-active:#0284c7;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:var(--sans);
      overflow:hidden;
    }

    /* Topbar */
    #topbar{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 14px;
      border-bottom:1px solid var(--border);
      background:var(--topbar-bg);
    }
    #titleBlock{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width: 220px;
    }
    #wfName{
      font-weight:650;
      font-size:14px;
      letter-spacing:.2px;
      line-height:1.1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    #wfDesc{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 54vw;
    }
    #controls{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .btn{
      appearance:none;
      background:transparent;
      color:var(--text);
      border:1px solid var(--border);
      border-radius:10px;
      padding:8px 10px;
      font-size:12px;
      cursor:pointer;
      transition:transform .05s ease, border-color .2s ease, background .2s ease;
      user-select:none;
    }
    .btn:hover{ border-color:var(--hover-border); background:var(--hover-bg); }
    .btn:active{ transform: translateY(1px); }
    select.btn{ padding:7px 8px; }
    .sep{ width:1px; height:20px; background:var(--border); margin:0 2px; }

    #hint{
      font-size:12px;
      color:var(--muted);
      user-select:none;
      white-space:nowrap;
    }

    /* Run bar(阶段5:运行状态区,设计 §4) */
    #runbar{
      height:44px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 14px;
      border-bottom:1px solid var(--border);
      background:var(--runbar-bg);
      font-size:12px;
      overflow:hidden;
      white-space:nowrap;
    }
    #runbar .rlabel{ color:var(--muted); }
    #threadInput{
      background:var(--input-bg);
      border:1px solid var(--border);
      color:var(--text);
      border-radius:8px;
      padding:6px 8px;
      font-size:12px;
      font-family:var(--mono);
      width:200px;
    }
    #threadInput:focus{ outline:none; border-color:var(--hover-border); }
    #runStateChip{
      display:inline-block;
      padding:3px 9px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--chip-bg);
      font-family:var(--mono);
      font-size:11px;
      color:var(--muted);
    }
    #runStateChip.s-running{ color:var(--chip-run-text); border-color:var(--st-run); }
    #runStateChip.s-waiting_human{ color:var(--chip-wait-text); border-color:var(--st-wait); }
    #runStateChip.s-completed{ color:var(--chip-done-text); border-color:var(--st-done); }
    #runStateChip.s-failed{ color:var(--chip-fail-text); border-color:var(--st-fail); }
    #runCounts{ font-family:var(--mono); color:var(--muted); }
    #runMeta{ font-family:var(--mono); color:var(--muted); overflow:hidden; text-overflow:ellipsis; }
    #runMeta.err{ color:var(--err-text); }
    #followWrap{ display:flex; align-items:center; gap:4px; color:var(--muted); user-select:none; cursor:pointer; }
    #followWrap input{ accent-color:#3b82f6; }

    /* Legend(七态图例) */
    #legend{
      display:flex;
      align-items:center;
      gap:8px;
      margin-left:6px;
      padding-left:10px;
      border-left:1px solid var(--border);
    }
    .lg{ display:flex; align-items:center; gap:4px; color:var(--muted); font-size:11px; }
    .lg i{
      width:9px; height:9px; border-radius:50%;
      display:inline-block; border:1px solid var(--border);
    }
    .lg.run i{ background:transparent; border-color:var(--st-run); }
    .lg.done i{ background:var(--st-done); border-color:var(--st-done); }
    .lg.wait i{ background:var(--st-wait); border-color:var(--st-wait); }
    .lg.retry i{ background:var(--st-retry); border-color:var(--st-retry); }
    .lg.fail i{ background:var(--st-fail); border-color:var(--st-fail); }
    .lg.skip i{ background:var(--skip-bg); border-color:var(--skip-border); }

    /* Viewport + canvas */
    #viewport{
      height: calc(100vh - 100px);
      overflow:auto;
      position:relative;
    }
    #canvas{
      position:relative;
      /*
        IMPORTANT: the workflow can have many depth columns; nodes may extend wider/taller
        than the initial minimum. We keep a safe base size here, and JS will expand the
        canvas to fit all nodes so edges/arrow coordinates stay 1:1 with pixels.
      */
      min-width: 2600px;
      min-height: 1600px;
      padding: 24px;
      box-sizing: border-box;
    }

    /* Edges svg */
    #edges{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
      overflow:visible;
      z-index: 1;
    }
    .edge{
      stroke: var(--edge);
      stroke-width: 1.6;
      fill: none;
      opacity: .85;
    }
    .edge.dim{ opacity:.18; }
    .edge.highlight{ opacity:1; stroke-width:2.2; }
    /* 第5期 TB:条件边点线 / 反馈边虚线(计划 §4.3)。
       必须在 traversed/active 之前声明 —— 同优先级后声明胜出,
       已走过/活动边的状态样式才能覆盖布局语义样式。 */
    .edge.kind-conditional{ stroke-dasharray: 3 4; opacity: .8; }
    .edge.feedback{ stroke-dasharray: 7 5; opacity: .75; }
    /* 「未启用/未接入」区带分隔标签(主图 TB 且存在不可达节点时,计划 §4.2) */
    .band-label{
      position:absolute;
      z-index:2;
      font-size:11px;
      color:var(--muted);
      background:var(--panel);
      border:1px dashed var(--border);
      border-radius:999px;
      padding:4px 12px;
      user-select:none;
    }
    /* 已走过的路径 / 当前活动路径(§4.1 连线三种信息) */
    .edge.traversed{ stroke: var(--edge-traversed); opacity:.9; }
    .edge.active{
      stroke: var(--edge-active);
      opacity: 1;
      stroke-width: 2.6;
      stroke-dasharray: 7 5;
      animation: edgeflow 1.1s linear infinite;
    }
    @keyframes edgeflow{
      to { stroke-dashoffset: -12; }
    }

    /* Nodes */
    .node{
      position:absolute;
      width: 340px;
      background: var(--panel);
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      z-index: 2;
      user-select:none;
      touch-action: none;
      transition: border-color .25s ease, box-shadow .25s ease;
    }
    .node:focus{ outline:none; box-shadow: 0 0 0 2px var(--hover-border), var(--shadow); }

    /* 运行状态(§4.1) */
    .node.st-running{ border-color: var(--st-run); box-shadow: 0 0 0 1px var(--st-run), var(--shadow); animation: pulse 1.6s ease-in-out infinite; }
    .node.st-done{ border-color: color-mix(in srgb, var(--st-done) 55%, var(--border)); }
    .node.st-waiting{ border-color: var(--st-wait); box-shadow: 0 0 0 1px var(--st-wait), var(--shadow); }
    .node.st-retrying{ border-color: var(--st-retry); box-shadow: 0 0 0 1px var(--st-retry), var(--shadow); }
    .node.st-failed{ border-color: var(--st-fail); box-shadow: 0 0 0 1.5px var(--st-fail), var(--shadow); }
    .node.st-skipped{ opacity:.45; border-style: dashed; }
    .node.st-offline{ opacity:.5; border-style: dashed; border-color:var(--offline-border); }
    @keyframes pulse{
      0%,100% { box-shadow: 0 0 0 1px var(--st-run), var(--shadow); }
      50%     { box-shadow: 0 0 0 4px color-mix(in srgb, var(--st-run) 35%, transparent), var(--shadow); }
    }

    /* 节点标题旁的状态点 + attempt */
    .statusdot{
      width:10px; height:10px; border-radius:50%;
      border:1px solid var(--border);
      background:var(--dot-bg);
      flex: 0 0 auto;
      margin-top:3px;
    }
    .statusdot.running{ background: transparent; border:2px solid var(--st-run); animation: dotpulse 1.2s ease-in-out infinite; }
    .statusdot.done{ background: var(--st-done); border-color: var(--st-done); }
    .statusdot.waiting{ background: var(--st-wait); border-color: var(--st-wait); }
    .statusdot.retrying{ background: var(--st-retry); border-color: var(--st-retry); }
    .statusdot.failed{ background: var(--st-fail); border-color: var(--st-fail); }
    .statusdot.skipped{ background:var(--skip-bg); border-color:var(--skip-border); }
    @keyframes dotpulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
    .statusAttempt{
      font-family: var(--mono);
      font-size:10px;
      color: var(--muted);
      border:1px solid var(--border);
      border-radius:999px;
      padding:1px 6px;
      display:none;
    }
    .statusAttempt.visible{ display:inline-block; }

    .node-header{
      padding: 12px 12px 10px;
      border-bottom:1px solid var(--border);
      background: var(--panel2);
      border-top-left-radius: var(--radius);
      border-top-right-radius: var(--radius);
      cursor: grab;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }
    .node-header:active{ cursor: grabbing; }

    /* Title + collapsed description stack */
    .node-titlewrap{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
      flex: 1 1 auto;
    }

    .node-title{
      font-weight: 650;
      font-size: 13px;
      line-height: 1.2;
      letter-spacing: .2px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    /* Collapsed-state description (smaller font) */
    .node-desc-collapsed{
      display:none;
      font-size: 11px;
      line-height: 1.25;
      color: var(--muted);
      opacity: .92;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .node-desc-collapsed:empty{ display:none !important; }
    .node.collapsed .node-desc-collapsed{
      display:block; /* fallback */
      display:-webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .node-badges{
      display:flex;
      align-items:center;
      gap:6px;
      flex: 0 0 auto;
    }
    .badge{
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      border:1px solid var(--border);
      color: var(--muted);
      background: var(--chip-bg);
      max-width: 120px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .node-body{
      padding: 12px;
      display:block;
      font-size: 12px;
      line-height: 1.35;
      color: var(--text);
    }
    .node.collapsed .node-body{
      display:none;
    }
    .node.collapsed .node-header{
      border-bottom: none;
    }
    .node-meta{
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 10px;
      font-family: var(--mono);
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .kv{
      border:1px solid var(--border);
      padding: 3px 6px;
      border-radius: 8px;
      background:var(--kv-bg);
    }

    .section{
      margin-top: 10px;
      border-top: 1px dashed var(--section-dash);
      padding-top: 10px;
    }
    .section h4{
      margin: 0 0 8px;
      font-size: 11px;
      letter-spacing: .2px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
    }
    .desc{
      color: var(--text);
      margin: 0 0 8px;
      opacity: .95;
    }
    .pillRow{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }
    .pill{
      font-size: 11px;
      color: var(--muted);
      border:1px solid var(--border);
      background:var(--kv-bg);
      border-radius: 999px;
      padding: 3px 8px;
      font-family: var(--mono);
    }
    .empty{
      color: var(--muted);
      font-style: italic;
      font-size: 11px;
    }

    /* 运行状态 section(展开可见;§4.2 白名单字段) */
    .runline{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
    .runline .kv b{ font-weight:600; }
    .runErr{
      color:var(--err-text);
      font-family:var(--mono);
      font-size:11px;
      white-space:pre-wrap;
      word-break:break-word;
      border:1px solid var(--err-border);
      background:var(--err-bg);
      border-radius:8px;
      padding:6px 8px;
    }
    .runWait{
      color:var(--wait-text);
      font-family:var(--mono);
      font-size:11px;
      border:1px solid var(--wait-border);
      background:var(--wait-bg);
      border-radius:8px;
      padding:6px 8px;
    }

    table.schema{
      width:100%;
      border-collapse: collapse;
      table-layout: fixed;
      border:1px solid var(--border);
      border-radius: 10px;
      overflow:hidden;
    }
    table.schema thead th{
      background:var(--kv-bg);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .2px;
      text-transform: uppercase;
      padding: 8px 8px;
      border-bottom: 1px solid var(--border);
      font-weight: 650;
    }
    table.schema td{
      padding: 8px 8px;
      border-bottom: 1px solid var(--table-row-border);
      vertical-align: top;
      word-break: break-word;
    }
    table.schema tr:last-child td{ border-bottom:none; }
    .mono{ font-family: var(--mono); }
    .right{ text-align:right; }
    .small{ font-size: 11px; color: var(--muted); }

    /* Hover highlighting */
    .node:hover{ border-color:var(--hover-border); }
    .node.dragging{ opacity: .95; border-color:var(--node-drag-border); }

    /* Loading / error */
    #overlay{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 10;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(3px);
    }
    #overlay.hidden{ display:none; }
    #overlayCard{
      width:min(560px, 92vw);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    #overlayTitle{
      font-weight: 650;
      font-size: 14px;
      margin:0 0 8px;
    }
    #overlayText{
      margin:0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      font-family: var(--mono);
      white-space: pre-wrap;
    }
  </style>
  <script>
    /* 主题预置:首帧前应用上次选择的背景主题,避免闪烁 */
    try{
      if(localStorage.getItem("wf_node_map_theme") === "light"){
        document.documentElement.dataset.theme = "light";
      }
    }catch(e){}
  </script>
</head>
<body>
  <div id="topbar">
    <div id="titleBlock">
      <div id="wfName">Workflow Node Map</div>
      <div id="wfDesc">Reads workflow.json and renders a draggable node map (minimal grayscale).</div>
    </div>

    <div id="controls">
      <select id="viewSelect" class="btn" title="切换视图">
        <option value="main">完整 LangGraph 工作流</option>
        <option value="storyline">OpenStoryline 子流程</option>
      </select>
      <div class="sep"></div>
      <button class="btn" id="btnExpand">Expand All</button>
      <button class="btn" id="btnCollapse">Collapse All</button>
      <div class="sep"></div>
      <button class="btn" id="btnReset">Reset Layout</button>
      <div class="sep"></div>
      <button class="btn" id="btnTheme" title="切换背景颜色(白/黑)">背景:白色</button>
    </div>
  </div>

  <div id="runbar">
    <span class="rlabel">thread</span>
    <input id="threadInput" spellcheck="false" placeholder="thread_id,如 video-webacc-001" />
    <button class="btn" id="btnSubscribe">订阅</button>
    <button class="btn" id="btnUnsubscribe">断开</button>
    <span id="runStateChip">未连接</span>
    <span id="runCounts"></span>
    <span id="runMeta"></span>
    <label id="followWrap" title="活动节点在视口外时自动滚动;拖动节点即暂停">
      <input type="checkbox" id="followChk" checked /> 跟随
    </label>
    <div id="legend">
      <span class="lg run"><i></i>执行中</span>
      <span class="lg done"><i></i>完成</span>
      <span class="lg wait"><i></i>等待</span>
      <span class="lg retry"><i></i>重试</span>
      <span class="lg fail"><i></i>失败</span>
      <span class="lg skip"><i></i>未参与</span>
    </div>
    <div id="hint" style="margin-left:auto">拖动节点 · 点标题展开/折叠</div>
  </div>

  <div id="viewport">
    <div id="canvas">
      <svg id="edges" aria-hidden="true">
        <defs>
          <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8.7" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L9,3 L0,6 Z" fill="var(--edge)"></path>
          </marker>
          <marker id="arrowHeadActive" markerWidth="10" markerHeight="10" refX="8.7" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L9,3 L0,6 Z" fill="var(--edge-active)"></path>
          </marker>
          <marker id="arrowHeadTraversed" markerWidth="10" markerHeight="10" refX="8.7" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L9,3 L0,6 Z" fill="var(--edge-traversed)"></path>
          </marker>
        </defs>
      </svg>
    </div>

    <div id="overlay">
      <div id="overlayCard">
        <p id="overlayTitle">Loading…</p>
        <p id="overlayText">Reading JSON and rendering nodes…</p>
      </div>
    </div>
  </div>

  <script>
    /* 渲染层(既有交互:拖拽/折叠/布局持久化/SVG 连线)。
       阶段5 实时化:数据源双视图(main=主图 API / storyline=14 节点 JSON)、
       节点七态、已走边投影、运行详情 section;事件消费在下方 module 脚本,
       经 window.__wfHooks 与本层解耦。 */
    (function(){
      const SVG_NS = "http://www.w3.org/2000/svg";

      const viewport = document.getElementById("viewport");
      const canvas = document.getElementById("canvas");
      const edgesSvg = document.getElementById("edges");

      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");

      const wfNameEl = document.getElementById("wfName");
      const wfDescEl = document.getElementById("wfDesc");
      const viewSelect = document.getElementById("viewSelect");

      const btnExpand = document.getElementById("btnExpand");
      const btnCollapse = document.getElementById("btnCollapse");
      const btnReset = document.getElementById("btnReset");
      const btnTheme = document.getElementById("btnTheme");

      const params = new URLSearchParams(location.search);
      // 视图:main=完整 LangGraph 工作流(/api/workflow/graph);
      // storyline=Storyline 子流程静态快照(node_map/workflow.json,
      // 2026-11-13 边审计阶段5 已同步当前 17 节点拓扑;仅为示意,权威以 graph.py 为准)。
      const DEFAULT_DATA_URL = params.get("data") || "node_map/workflow.json";
      const MAIN_API_URL = "/api/workflow/graph";

      const state = {
        view: null,          // "main" | "storyline"
        data: null,          // 归一后的渲染数据(nodes/edges/workflow_meta)
        schemaVersion: null, // 主图 schema_version(布局 key 一部分)
        mode: null,          // 主图 mode(布局 key 一部分)
        workflowId: null,
        nodesById: new Map(),
        nodeEls: new Map(),
        edges: [], // {from,to,el,id,kind,label,layoutRole}
        layoutKey: null,
        saveTimer: null,
        // 第5期:纵向有向图布局(TB)
        direction: "tb",            // 主图方向:"tb"(默认)| "lr"(备用);子流程不适用
        layoutModule: null,         // workflow_layout.mjs(动态 import,失败降级横向)
        layoutModulePromise: null,
        layoutResult: null,         // 最近一次 TB 布局输出(反馈 lane/区带/角色)
        positionsCustomized: false, // 用户手动拖拽后为 true,自动重排不再覆盖(计划 §4.4)
        bandLabelEl: null,          // 「未启用/未接入」区带标签
        edgeAnchorIndex: null,      // 同源/同目标多边的锚点分散索引
        // 实时层
        nodeStatus: {},      // id -> status(渲染投影,由 hooks 更新)
        programmaticScroll: false
      };

      function escapeHtml(s){
        return String(s)
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#039;");
      }

      function formatValue(v){
        if (v === undefined) return "";
        if (v === null) return "null";
        if (typeof v === "string") return v;
        try { return JSON.stringify(v); } catch (e) { return String(v); }
      }

      function setOverlay(title, text, hidden){
        overlayTitle.textContent = title || "";
        overlayText.textContent = text || "";
        overlay.classList.toggle("hidden", !!hidden);
      }

      function computeDepths(nodes){
        /* 最长路径分层(DFS + 回边忽略)。旧实现是迭代松弛:主图含
           QC/qa 重试回环与 node_07 自环,松弛在环上不收敛,深度会被
           MAX_ITERS 顶到天上去 → 列布局炸穿。DFS 遇到 visiting 态的
           依赖(回边/自环)按 0 贡献跳过,DAG 部分照常取最长链。 */
        const byId = new Map(nodes.map(n => [n.id, n]));
        const depsOf = new Map(nodes.map(n => [n.id,
          (Array.isArray(n.dependencies) ? n.dependencies : []).filter(d => byId.has(d) && d !== n.id)
        ]));
        const depth = new Map(nodes.map(n => [n.id, 0]));
        const mark = new Map(); // 0=未访问 1=访问中 2=完成
        function visit(id){
          const st = mark.get(id) || 0;
          if (st === 2) return depth.get(id) || 0;
          if (st === 1) return 0; // 回边/环:忽略,防不收敛
          mark.set(id, 1);
          let d = 0;
          for (const dep of depsOf.get(id) || []){
            d = Math.max(d, visit(dep) + 1);
          }
          mark.set(id, 2);
          depth.set(id, d);
          return d;
        }
        for (const n of nodes) visit(n.id);
        return depth;
      }

      function computeHorizontalPositions(nodes){
        /* 原横向分层布局(第5期保留为 LR 备用方向;主图默认已改走
           workflow_layout.mjs 的纵向有向图布局)。行为与旧 autoLayout 一致。 */
        const depth = computeDepths(nodes);
        const cols = new Map(); // depth -> array of node ids
        for(const n of nodes){
          const d = depth.get(n.id) || 0;
          if(!cols.has(d)) cols.set(d, []);
          cols.get(d).push(n.id);
        }
        // Stable sort by name within each column
        for(const [d, arr] of cols){
          arr.sort((a,b)=>{
            const na = state.nodesById.get(a)?.name || a;
            const nb = state.nodesById.get(b)?.name || b;
            return na.localeCompare(nb);
          });
        }

        const columnWidth = 420;
        const rowHeight = 170;

        const positions = {};
        const depths = Array.from(cols.keys()).sort((a,b)=>a-b);
        for(const d of depths){
          const arr = cols.get(d);
          for(let i=0;i<arr.length;i++){
            const id = arr[i];
            positions[id] = {
              x: 40 + d * columnWidth,
              y: 40 + i * rowHeight
            };
          }
        }
        return positions;
      }

      // ---------------------------------------------------------------------------
      // 第5期:纵向有向图布局(TB)——模块加载/坐标应用/区带标签/布局角色
      // ---------------------------------------------------------------------------
      function ensureLayoutModule(timeoutMs = 3000){
        /* 动态加载 workflow_layout.mjs(classic 脚本内原生 dynamic import)。
           失败不阻塞页面:主图降级横向布局并 console.warn,子流程本就不依赖模块。 */
        if (state.layoutModule) return Promise.resolve(state.layoutModule);
        if (!state.layoutModulePromise){
          state.layoutModulePromise = import("/static/workflow_layout.mjs")
            .then(m => { state.layoutModule = m; return m; })
            .catch(err => {
              console.warn("workflow_layout 模块不可用,纵向布局降级为横向:", err);
              return null;
            });
        }
        return Promise.race([
          state.layoutModulePromise,
          new Promise(resolve => setTimeout(() => resolve(state.layoutModule), timeoutMs)),
        ]);
      }

      function resetCanvasSize(){
        /* 回到 CSS 基准尺寸:方向切换/重渲染后由 ensureCanvasSize 按新布局
           重新扩展,避免 LR 宽画布残留把 TB 图挤在角落(计划 §4.4)。 */
        canvas.style.width = "";
        canvas.style.height = "";
      }

      function applyHorizontalPositions(positions){
        for (const n of (state.data && state.data.nodes) || []){
          const el = state.nodeEls.get(n.id);
          if (!el) continue;
          const p = positions && positions[n.id] ? positions[n.id] : { x: 40, y: 40 };
          el.style.left = p.x + "px";
          el.style.top = p.y + "px";
        }
      }

      function removeBandLabel(){
        if (state.bandLabelEl){
          state.bandLabelEl.remove();
          state.bandLabelEl = null;
        }
      }

      function renderBandLabel(result){
        removeBandLabel();
        if (!result || result.unreachableBandTopY == null) return;
        const div = document.createElement("div");
        div.className = "band-label";
        div.textContent = "未启用 / 未接入(不可达节点)";
        div.style.left = "48px";
        div.style.top = Math.max(0, result.unreachableBandTopY - 36) + "px";
        canvas.appendChild(div);
        state.bandLabelEl = div;
      }

      function applyTBLayout(options){
        /* 纵向有向图布局(主图 TB):测 DOM → 纯模块计算 → 应用坐标。
           skipPositions=true 时只产出 lane/区带/反馈角色(用户自定义坐标场景,
           计划 §6.2 第 6 条:渲染管线 = 建节点 → 折叠态 → 测量 → 坐标)。 */
        const opts = options || {};
        const mod = state.layoutModule;
        if (!mod || !state.data || !Array.isArray(state.data.edges) || !state.data.edges.length) return false;
        if (opts.resetCanvas) resetCanvasSize();
        const measurements = {};
        for (const [id, el] of state.nodeEls){
          measurements[id] = { width: el.offsetWidth, height: el.offsetHeight };
        }
        let result;
        try{
          result = mod.computeLayeredGraphPositions(state.data.nodes, state.data.edges, measurements, {
            direction: "TB",
            onWarning: (msg) => console.warn(msg),
          });
        }catch(err){
          console.warn("纵向布局计算失败,降级横向:", err);
          return false;
        }
        state.layoutResult = result;
        if (!opts.skipPositions){
          for (const [id, p] of result.positions){
            const el = state.nodeEls.get(id);
            if (!el) continue;
            el.style.left = p.x + "px";
            el.style.top = p.y + "px";
          }
        }
        renderBandLabel(result);
        return true;
      }

      function buildLayoutKey(){
        /* 布局 key(计划 §6.3):主图 TB 加算法版本后缀(_tb_v1),LR 沿用历史
           格式零迁移(用户已保存的横向拖拽位置不受影响);子流程沿用旧 key。
           与 workflow_monitor.mjs::mainLayoutKey 同规则,模块在时用单一来源。 */
        if (state.view !== "main") return "node_layout_" + state.workflowId;
        const mod = state.layoutModule;
        if (mod && mod.getLayoutCacheKey){
          return mod.getLayoutCacheKey({
            workflowId: state.workflowId,
            mode: state.mode,
            schemaVersion: state.schemaVersion,
            direction: state.direction,
          });
        }
        const base = `wf_layout_${state.workflowId}_${state.mode || "default"}_v${state.schemaVersion || 1}`;
        return state.direction === "tb" ? base + "_tb_v1" : base;
      }

      function markEdgeLayoutRoles(){
        /* TB 布局角色:反馈边加虚线样式 + 侧边 lane 路由。
           只加前端临时布局角色,不改后端 kind/label/id(计划 §6.1 职责边界)。 */
        const fb = state.layoutResult && state.layoutResult.feedbackEdgeIds;
        const tb = state.view === "main" && state.direction === "tb";
        for (const e of state.edges){
          const isFb = !!(tb && fb && fb.has(e.id));
          e.layoutRole = isFb ? "feedback" : "forward";
          e.el.classList.toggle("feedback", isFb);
        }
      }

      function afterStructureChange(){
        /* 展开/折叠改变卡片高度:TB 自动布局按新尺寸重算层距;
           用户手动拖拽过(positionsCustomized)则不覆盖,只修连线(计划 §4.4)。 */
        if (state.view === "main" && state.direction === "tb" && !state.positionsCustomized){
          applyTBLayout({ resetCanvas: false });
        }
        ensureCanvasSize();
        updateAllEdges();
        saveLayoutDebounced();
      }

      // Ensure the scrollable canvas is big enough to contain all nodes.
      // This avoids SVG scaling issues (arrows not landing on cards) and keeps
      // the whole graph reachable via scroll.
      function ensureCanvasSize(){
        const BASE_W = 2600;
        const BASE_H = 1600;
        const EXTRA = 260; // breathing room to the right/bottom

        if(!state.nodeEls || state.nodeEls.size === 0) return;

        let maxRight = 0;
        let maxBottom = 0;

        for(const el of state.nodeEls.values()){
          const left = parseFloat(el.style.left || "0") || 0;
          const top = parseFloat(el.style.top || "0") || 0;
          const right = left + el.offsetWidth;
          const bottom = top + el.offsetHeight;
          maxRight = Math.max(maxRight, right);
          maxBottom = Math.max(maxBottom, bottom);
        }

        const desiredW = Math.max(BASE_W, Math.ceil(maxRight + EXTRA));
        const desiredH = Math.max(BASE_H, Math.ceil(maxBottom + EXTRA));

        // Only expand; do not shrink automatically to avoid jarring jumps.
        const currentW = canvas.clientWidth || 0;
        const currentH = canvas.clientHeight || 0;

        if(desiredW > currentW) canvas.style.width = desiredW + "px";
        if(desiredH > currentH) canvas.style.height = desiredH + "px";
      }

      function loadLayout(){
        if(!state.layoutKey) return null;
        try{
          const raw = localStorage.getItem(state.layoutKey);
          if(!raw) return null;
          return JSON.parse(raw);
        }catch(e){
          return null;
        }
      }

      function saveLayoutDebounced(){
        if(!state.layoutKey) return;
        clearTimeout(state.saveTimer);
        state.saveTimer = setTimeout(saveLayout, 120);
      }

      function saveLayout(){
        if(!state.layoutKey) return;
        const positions = {};
        const collapsed = {};
        for(const [id, el] of state.nodeEls){
          positions[id] = {
            x: parseFloat(el.style.left || "0"),
            y: parseFloat(el.style.top || "0")
          };
          collapsed[id] = el.classList.contains("collapsed");
        }
        const payload = { positions, collapsed };
        // 第5期:主图 payload 记录方向与自定义标记(计划 §6.3);
        // TB 自动坐标每次渲染重算,仅 positionsCustomized 时恢复保存坐标。
        if (state.view === "main"){
          payload.direction = state.direction;
          payload.layoutAlgorithmVersion = state.direction === "tb" ? "v1" : undefined;
          payload.positionsCustomized = state.positionsCustomized;
        }
        try{
          localStorage.setItem(state.layoutKey, JSON.stringify(payload));
        }catch(e){
          // ignore quota errors
        }
      }

      function resetLayout(){
        /* Reset Layout:清当前方向 key(TB/LR 各自隔离,计划 §7 阶段3),
           重应用当前方向算法;TB 重置画布基准尺寸再扩展。 */
        if(state.layoutKey){
          localStorage.removeItem(state.layoutKey);
        }
        state.positionsCustomized = false;
        if(!(state.view === "main" && state.direction === "tb" && applyTBLayout({ resetCanvas: true }))){
          removeBandLabel();
          applyHorizontalPositions(computeHorizontalPositions(state.data.nodes));
        }
        ensureCanvasSize();
        updateAllEdges();
      }

      function schemaTable(schema){
        if(!Array.isArray(schema) || schema.length === 0){
          return '<div class="empty">—</div>';
        }
        const rows = schema.map(f => {
          const name = escapeHtml(f.name ?? "");
          const type = escapeHtml(f.type ?? "");
          const def = escapeHtml(formatValue(f.default ?? ""));
          const opts = Array.isArray(f.options) ? escapeHtml(f.options.join(", ")) : "";
          const desc = escapeHtml(f.description ?? "");
          return `<tr>
            <td class="mono">${name}</td>
            <td class="mono">${type}</td>
            <td class="mono">${def}</td>
            <td class="mono">${opts}</td>
            <td>${desc}</td>
          </tr>`;
        }).join("");
        return `<table class="schema">
          <thead><tr>
            <th class="right">name</th>
            <th>type</th>
            <th>default</th>
            <th>options</th>
            <th>description</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
      }

      function pillList(ids){
        if(!Array.isArray(ids) || ids.length === 0){
          return '<div class="empty">—</div>';
        }
        const pills = ids.map(id => `<span class="pill">${escapeHtml(id)}</span>`).join("");
        return `<div class="pillRow">${pills}</div>`;
      }

      function nodeBodyHtml(node){
        const isMain = state.view === "main";
        const metaKvs = [`id: ${escapeHtml(node.id)}`, `kind: ${escapeHtml(node.kind ?? "")}`];
        if (isMain){
          if (node.group) metaKvs.push(`group: ${escapeHtml(node.group)}`);
          if (node.checkpoint) metaKvs.push(`关卡: ${escapeHtml(node.checkpoint)}`);
          if (Array.isArray(node.modes) && node.modes.length) metaKvs.push(`modes: ${escapeHtml(node.modes.join("/"))}`);
          if (node.waiting_kind) metaKvs.push(`等待类别: ${escapeHtml(node.waiting_kind)}`);
          if (node.enabled === false) metaKvs.push("配置未启用");
          if (node.enabled !== false && node.reachable === false) metaKvs.push("未连通");
        } else {
          metaKvs.push(`pro: ${node.pro ? "true" : "false"}`);
        }
        const meta = `<div class="node-meta">${metaKvs.map(k => `<span class="kv">${k}</span>`).join("")}</div>`;

        const desc = node.description ? `<p class="desc">${escapeHtml(node.description)}</p>` : '';

        const runSec = isMain ? `
          <div class="section">
            <h4>Run Status</h4>
            <div class="runstatus" data-runsec="${escapeHtml(node.id)}"><div class="empty">—</div></div>
          </div>
        ` : '';

        // 主图节点没有 input/output schema;子流程保留原有两表
        const input = (!isMain && node.input_schema) ? `
          <div class="section">
            <h4>Input Schema</h4>
            ${schemaTable(node.input_schema)}
          </div>
        ` : '';

        const output = (!isMain && node.output_schema) ? `
          <div class="section">
            <h4>Output Schema</h4>
            ${schemaTable(node.output_schema)}
          </div>
        ` : '';

        const deps = `
          <div class="section">
            <h4>Dependencies</h4>
            ${pillList(node.dependencies)}
          </div>
        `;

        const nexts = `
          <div class="section">
            <h4>Next Nodes</h4>
            ${pillList(node.next_nodes)}
          </div>
        `;

        return meta + desc + runSec + deps + nexts + input + output;
      }

      function createNodeEl(node){
        const el = document.createElement("div");
        el.className = "node collapsed";
        el.tabIndex = 0;
        el.dataset.id = node.id;

        const header = document.createElement("div");
        header.className = "node-header";

        const titleWrap = document.createElement("div");
        titleWrap.className = "node-titlewrap";

        const title = document.createElement("div");
        title.className = "node-title";
        title.textContent = node.name || node.id;

        const descCollapsed = document.createElement("div");
        descCollapsed.className = "node-desc-collapsed";
        descCollapsed.textContent = node.description || "";

        titleWrap.appendChild(title);
        titleWrap.appendChild(descCollapsed);

        // 状态点 + attempt(实时层更新;所有状态下都可见)
        const statusDot = document.createElement("span");
        statusDot.className = "statusdot";
        statusDot.title = "未开始";
        const statusAttempt = document.createElement("span");
        statusAttempt.className = "statusAttempt";

        const badges = document.createElement("div");
        badges.className = "node-badges";
        const badgeKind = document.createElement("span");
        badgeKind.className = "badge";
        badgeKind.textContent = node.kind || "node";
        badges.appendChild(statusDot);
        badges.appendChild(statusAttempt);
        if (state.view !== "main"){
          const badgePro = document.createElement("span");
          badgePro.className = "badge";
          badgePro.textContent = node.pro ? "PRO" : "NORMAL";
          badges.appendChild(badgePro);
        }

        header.appendChild(titleWrap);
        header.appendChild(badges);

        const body = document.createElement("div");
        body.className = "node-body";
        body.innerHTML = nodeBodyHtml(node);

        el.appendChild(header);
        el.appendChild(body);

        // Collapsed view: hide badges; keep title + description visible.
        badges.style.display = "none";

        // 主图:配置未启用 / 未连通的节点以"离线"样式呈现(§4.1 未参与)
        if (state.view === "main" && (node.enabled === false || node.reachable === false)){
          el.classList.add("st-offline");
        }

        attachDragAndToggle(el, header, badges);

        // Hover highlights
        el.addEventListener("mouseenter", () => highlightConnections(node.id, true));
        el.addEventListener("mouseleave", () => highlightConnections(node.id, false));

        return el;
      }

      function setCollapsed(el, collapsed){
        const header = el.querySelector(".node-header");
        const badges = header.querySelector(".node-badges");
        el.classList.toggle("collapsed", !!collapsed);
        badges.style.display = collapsed ? "none" : "flex";
      }

      function toggleNode(el){
        const wasCollapsed = el.classList.contains("collapsed");
        setCollapsed(el, !wasCollapsed);
        // 展开时补渲染运行状态(事件可能先于展开到达)
        if (wasCollapsed){
          const onExpand = window.__wfOnExpand;
          if (onExpand) onExpand(el.dataset.id);
        }
        // Expanding/collapsing changes node height; keep the canvas large enough.
        // 第5期:TB 自动布局时按新高度重算层距(自定义布局只修连线)
        afterStructureChange();
      }

      function attachDragAndToggle(el, header, badges){
        let startX = 0, startY = 0;
        let originLeft = 0, originTop = 0;
        let dragging = false;

        const DRAG_THRESHOLD = 4;

        header.addEventListener("pointerdown", (e) => {
          if(e.button !== 0) return;
          header.setPointerCapture(e.pointerId);
          dragging = false;
          startX = e.clientX;
          startY = e.clientY;

          const canvasRect = canvas.getBoundingClientRect();
          const rect = el.getBoundingClientRect();
          originLeft = rect.left - canvasRect.left;
          originTop = rect.top - canvasRect.top;

          el.classList.add("dragging");
          e.preventDefault();
        });

        header.addEventListener("pointermove", (e) => {
          if(!header.hasPointerCapture(e.pointerId)) return;

          const dx = e.clientX - startX;
          const dy = e.clientY - startY;

          if(!dragging && (Math.abs(dx) + Math.abs(dy) > DRAG_THRESHOLD)){
            dragging = true;
          }

          if(dragging){
            // Keep nodes inside the 0,0 quadrant so the scroll area is always reachable.
            const newLeft = Math.max(0, originLeft + dx);
            const newTop = Math.max(0, originTop + dy);
            el.style.left = newLeft + "px";
            el.style.top = newTop + "px";
            updateEdgesForNode(el.dataset.id);
          }
        });

        function endPointer(e){
          if(!header.hasPointerCapture(e.pointerId)) return;
          header.releasePointerCapture(e.pointerId);
          el.classList.remove("dragging");

          if(!dragging){
            // Click without drag -> toggle
            toggleNode(el);
          }else{
            // 拖动即暂停自动跟随(设计 §6.2-F 第 6 条)
            const follow = document.getElementById("followChk");
            if (follow) follow.checked = false;
            // 第5期:手动拖拽后布局标记为自定义,展开/折叠不再自动重排(计划 §4.4)
            state.positionsCustomized = true;
            // Dragging may move nodes beyond current canvas bounds.
            ensureCanvasSize();
            saveLayoutDebounced();
          }
        }

        header.addEventListener("pointerup", endPointer);
        header.addEventListener("pointercancel", endPointer);

        // Keyboard toggle
        el.addEventListener("keydown", (e) => {
          if(e.key === "Enter" || e.key === " "){
            e.preventDefault();
            toggleNode(el);
          }
        });
      }

      function addEdge(fromId, toId, dedupe, edge){
        if(!state.nodesById.has(fromId) || !state.nodesById.has(toId)) return;
        // 主图按后端 edge id 去重(边完整性,计划 §9.1);子流程无 id 仍按 from→to
        const key = (edge && edge.id) ? `id:${edge.id}` : fromId + "→" + toId;
        if(dedupe.has(key)) return;
        dedupe.add(key);

        const path = document.createElementNS(SVG_NS, "path");
        path.classList.add("edge");
        if (edge && edge.kind === "conditional") path.classList.add("kind-conditional");
        path.setAttribute("marker-end", "url(#arrowHead)");
        path.dataset.from = fromId;
        path.dataset.to = toId;
        if (edge && edge.id) path.dataset.edgeId = edge.id;
        if (edge && edge.label){
          // 条件/屏障 label 经原生 tooltip 展示(计划 §4.3:标签默认不常驻绘制)
          const tip = document.createElementNS(SVG_NS, "title");
          tip.textContent = (edge.kind === "conditional" ? "[条件] " : "") + edge.label;
          path.appendChild(tip);
        }
        edgesSvg.appendChild(path);

        // 第5期(计划 §2.4):保存后端边的 kind/label/原始 id —— SSE 投影按 id
        // 匹配已走边,kind/label 提供边语义;layoutRole 是前端临时布局角色。
        state.edges.push({
          from: fromId,
          to: toId,
          el: path,
          id: (edge && edge.id) || (fromId + "->" + toId),
          kind: (edge && edge.kind) || "normal",
          label: (edge && edge.label != null) ? edge.label : null,
          layoutRole: "forward",
        });
      }

      function buildEdges(){
        // Remove existing
        state.edges = [];
        // Keep defs (arrow markers)
        const defs = edgesSvg.querySelector("defs");
        edgesSvg.innerHTML = "";
        edgesSvg.appendChild(defs);

        const dedupe = new Set();
        // 主图:API 直接给 edges(含 kind/label);子流程:沿用 dependencies/next_nodes
        if (Array.isArray(state.data.edges) && state.data.edges.length){
          for(const e of state.data.edges){
            addEdge(e.from, e.to, dedupe, e);
          }
        } else {
          for(const node of state.data.nodes){
            const deps = Array.isArray(node.dependencies) ? node.dependencies : [];
            for(const depId of deps){
              addEdge(depId, node.id, dedupe);
            }
            const nexts = Array.isArray(node.next_nodes) ? node.next_nodes : [];
            for(const nxt of nexts){
              addEdge(node.id, nxt, dedupe);
            }
          }
        }
        rebuildEdgeAnchorIndices();
      }

      function rebuildEdgeAnchorIndices(){
        /* 同源多出边/同目标多入边的锚点分散索引(计划 §5.7):按 edge id
           稳定排序编号,同一布局多次重画时锚点位置不漂移。 */
        const index = new Map();
        const byFrom = new Map();
        const byTo = new Map();
        for (const e of state.edges){
          if (!byFrom.has(e.from)) byFrom.set(e.from, []);
          byFrom.get(e.from).push(e);
          if (!byTo.has(e.to)) byTo.set(e.to, []);
          byTo.get(e.to).push(e);
        }
        const assign = (groups, countKey, idxKey) => {
          for (const list of groups.values()){
            list.sort((a, b) => String(a.id).localeCompare(String(b.id)));
            list.forEach((e, i) => {
              if (!index.has(e.id)) index.set(e.id, { outIndex: 0, outCount: 1, inIndex: 0, inCount: 1 });
              const entry = index.get(e.id);
              entry[countKey] = list.length;
              entry[idxKey] = i;
            });
          }
        };
        assign(byFrom, "outCount", "outIndex");
        assign(byTo, "inCount", "inIndex");
        state.edgeAnchorIndex = index;
      }

      function rectInCanvas(el){
        /*
          IMPORTANT:
          Use the SVG element as the coordinate reference, not `canvas.scrollWidth`.
          If the workflow spans wider than the base canvas size, using scrollWidth in
          the SVG viewBox would introduce a scale factor and arrows would drift away
          from cards.

          Here we measure everything in CSS pixels relative to the SVG viewport.
        */
        const svgRect = edgesSvg.getBoundingClientRect();
        const r = el.getBoundingClientRect();

        const left = r.left - svgRect.left;
        const top = r.top - svgRect.top;
        const width = r.width;
        const height = r.height;

        return {
          left,
          top,
          width,
          height,
          right: left + width,
          bottom: top + height,
          cx: left + width/2,
          cy: top + height/2
        };
      }

      function anchorPoint(rect, side){
        switch(side){
          case "left": return { x: rect.left, y: rect.cy };
          case "right": return { x: rect.right, y: rect.cy };
          case "top": return { x: rect.cx, y: rect.top };
          case "bottom": return { x: rect.cx, y: rect.bottom };
          default: return { x: rect.cx, y: rect.cy };
        }
      }

      function edgePath(edge, fromRect, toRect){
        /* 路由分发(计划 §5.7):主图 TB 按布局角色路由 —— 普通前向边自上而下、
           反馈边沿侧边 lane 折返;LR 备用方向与子流程沿用原自动选边逻辑。 */
        if (state.view === "main" && state.direction === "tb"){
          if (edge.layoutRole === "feedback") return feedbackEdgePathTB(edge, fromRect, toRect);
          return forwardEdgePathTB(edge, fromRect, toRect);
        }
        return edgePathAuto(fromRect, toRect);
      }

      function spreadAnchor(rect, side, index, count){
        /* 锚点:同源多出边/同目标多入边在边法线方向展开,减少重叠(计划 §5.7)。 */
        const base = anchorPoint(rect, side);
        if (!count || count <= 1) return base;
        const vertical = (side === "left" || side === "right");
        const span = (vertical ? rect.height : rect.width) * 0.72;
        const t = index / (count - 1);
        if (vertical) return { x: base.x, y: rect.cy - span / 2 + span * t };
        return { x: rect.cx - span / 2 + span * t, y: base.y };
      }

      function forwardEdgePathTB(edge, fromRect, toRect){
        /* 普通前向边:源底部 → 目标顶部,垂直控制点贝塞尔(计划 §4.3)。 */
        const anchor = state.edgeAnchorIndex ? state.edgeAnchorIndex.get(edge.id) : null;
        const p1 = spreadAnchor(fromRect, "bottom", anchor ? anchor.outIndex : 0, anchor ? anchor.outCount : 1);
        const p2 = spreadAnchor(toRect, "top", anchor ? anchor.inIndex : 0, anchor ? anchor.inCount : 1);
        if (p2.y + 8 < p1.y){
          // 防御:非典型向上边(如不可达分量指回主流程)退回自动选边
          return edgePathAuto(fromRect, toRect);
        }
        const d = Math.max(40, (p2.y - p1.y) * 0.45);
        const c1 = { x: p1.x, y: p1.y + d };
        const c2 = { x: p2.x, y: p2.y - d };
        return `M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} C ${c1.x.toFixed(1)} ${c1.y.toFixed(1)}, ${c2.x.toFixed(1)} ${c2.y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
      }

      function feedbackEdgePathTB(edge, fromRect, toRect){
        /* 反馈/重试边:从源节点侧边引出,经画布左右侧 lane 折返,进入目标侧边;
           箭头始终指向真实目标,方向不反转(计划 §4.3/§5.7)。
           lane 由 workflow_layout.mjs 按 edge id 稳定分配,多条回路不叠线。 */
        const lane = (state.layoutResult && state.layoutResult.feedbackLanes &&
                      state.layoutResult.feedbackLanes.get(edge.id)) || { side: "left", index: 0 };
        const anchor = state.edgeAnchorIndex ? state.edgeAnchorIndex.get(edge.id) : null;
        const dir = lane.side === "left" ? -1 : 1;
        const offset = 36 + lane.index * 26;
        if (edge.from === edge.to){
          // 自环:沿节点一侧绕出再绕回,不参与层级(计划 §4.3)
          const x1 = dir < 0 ? fromRect.left : fromRect.right;
          const y1 = fromRect.top + fromRect.height * 0.3;
          const y2 = fromRect.top + fromRect.height * 0.7;
          const lx = dir < 0 ? x1 - offset : x1 + offset;
          return `M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${lx.toFixed(1)} ${y1.toFixed(1)}, ${lx.toFixed(1)} ${y2.toFixed(1)}, ${x1.toFixed(1)} ${y2.toFixed(1)}`;
        }
        const p1 = spreadAnchor(fromRect, lane.side, anchor ? anchor.outIndex : 0, anchor ? anchor.outCount : 1);
        const p2 = spreadAnchor(toRect, lane.side, anchor ? anchor.inIndex : 0, anchor ? anchor.inCount : 1);
        const raw = dir < 0 ? Math.min(p1.x, p2.x) - offset : Math.max(p1.x, p2.x) + offset;
        const laneX = dir < 0 ? Math.max(8, raw) : raw; // 左侧不越出画布可滚区
        return `M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} C ${laneX.toFixed(1)} ${p1.y.toFixed(1)}, ${laneX.toFixed(1)} ${p2.y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
      }

      function edgePathAuto(fromRect, toRect){
        const dx = toRect.cx - fromRect.cx;
        const dy = toRect.cy - fromRect.cy;

        const horizontal = Math.abs(dx) >= Math.abs(dy);

        let fromSide, toSide;
        if(horizontal){
          fromSide = dx >= 0 ? "right" : "left";
          toSide = dx >= 0 ? "left" : "right";
        }else{
          fromSide = dy >= 0 ? "bottom" : "top";
          toSide = dy >= 0 ? "top" : "bottom";
        }

        const p1 = anchorPoint(fromRect, fromSide);
        const p2 = anchorPoint(toRect, toSide);

        // Bezier control points
        const curvature = 0.55;
        let c1, c2;

        if(horizontal){
          const d = Math.max(60, Math.abs(p2.x - p1.x) * curvature);
          c1 = { x: p1.x + (fromSide === "right" ? d : -d), y: p1.y };
          c2 = { x: p2.x + (toSide === "left" ? -d : d), y: p2.y };
        }else{
          const d = Math.max(60, Math.abs(p2.y - p1.y) * curvature);
          c1 = { x: p1.x, y: p1.y + (fromSide === "bottom" ? d : -d) };
          c2 = { x: p2.x, y: p2.y + (toSide === "top" ? -d : d) };
        }

        return `M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} C ${c1.x.toFixed(1)} ${c1.y.toFixed(1)}, ${c2.x.toFixed(1)} ${c2.y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
      }

      function updateEdge(edge){
        const fromEl = state.nodeEls.get(edge.from);
        const toEl = state.nodeEls.get(edge.to);
        if(!fromEl || !toEl) return;

        const fromRect = rectInCanvas(fromEl);
        const toRect = rectInCanvas(toEl);

        edge.el.setAttribute("d", edgePath(edge, fromRect, toRect));
      }

      function updateAllEdges(){
        // Keep SVG user units == CSS pixels (no implicit scaling).
        const w = Math.max(1, edgesSvg.clientWidth);
        const h = Math.max(1, edgesSvg.clientHeight);
        edgesSvg.setAttribute("viewBox", `0 0 ${w} ${h}`);
        for(const e of state.edges) updateEdge(e);
      }

      function updateEdgesForNode(nodeId){
        for(const e of state.edges){
          if(e.from === nodeId || e.to === nodeId){
            updateEdge(e);
          }
        }
      }

      function highlightConnections(nodeId, on){
        for(const e of state.edges){
          const connected = (e.from === nodeId || e.to === nodeId);
          e.el.classList.toggle("dim", on && !connected);
          e.el.classList.toggle("highlight", on && connected);
        }
      }

      function collapseAll(){
        for(const [id, el] of state.nodeEls){
          setCollapsed(el, true);
        }
        afterStructureChange();
      }

      function expandAll(){
        for(const [id, el] of state.nodeEls){
          setCollapsed(el, false);
        }
        afterStructureChange();
      }

      btnCollapse.addEventListener("click", collapseAll);
      btnExpand.addEventListener("click", expandAll);
      btnReset.addEventListener("click", resetLayout);

      // 背景主题切换:黑色(默认) <-> 白色,经 localStorage 记忆;按钮文案显示点击后切到的目标主题
      function applyThemeButton(){
        btnTheme.textContent = document.documentElement.dataset.theme === "light" ? "背景:黑色" : "背景:白色";
      }
      applyThemeButton();
      btnTheme.addEventListener("click", () => {
        const toLight = document.documentElement.dataset.theme !== "light";
        if(toLight){ document.documentElement.dataset.theme = "light"; }
        else{ delete document.documentElement.dataset.theme; }
        try{ localStorage.setItem("wf_node_map_theme", toLight ? "light" : "dark"); }catch(e){}
        applyThemeButton();
      });

      // ---------------------------------------------------------------------------
      // 实时层钩子(module 脚本经 window.__wfHooks 调用;渲染层不订阅任何网络)
      // ---------------------------------------------------------------------------
      function setNodeStatus(id, status, attempt){
        state.nodeStatus[id] = status;
        const el = state.nodeEls.get(id);
        if(!el) return;
        for(const cls of ["st-running","st-done","st-waiting","st-retrying","st-failed","st-skipped"]){
          el.classList.remove(cls);
        }
        if (status && status !== "idle") el.classList.add("st-" + status);
        const dot = el.querySelector(".statusdot");
        if (dot){
          dot.className = "statusdot" + (status && status !== "idle" ? " " + status : "");
          const labels = {
            running: "执行中", done: "已完成", waiting: "等待人工/网页操作",
            retrying: "重试中", failed: "失败", skipped: "未参与",
          };
          dot.title = labels[status] || "未开始";
        }
        const att = el.querySelector(".statusAttempt");
        if (att){
          if (attempt && attempt > 1){
            att.textContent = "×" + attempt;
            att.classList.add("visible");
          } else {
            att.textContent = "";
            att.classList.remove("visible");
          }
        }
        // 离线样式与执行态互斥(执行态优先)
        if (status && status !== "idle") el.classList.remove("st-offline");
      }

      function setEdgeStates(traversedSet, activeSet){
        for(const e of state.edges){
          const key = e.id;
          const isTrav = traversedSet && traversedSet.has(key);
          const isActive = activeSet && activeSet.has(key);
          e.el.classList.toggle("traversed", !!isTrav && !isActive);
          e.el.classList.toggle("active", !!isActive);
          e.el.setAttribute(
            "marker-end",
            isActive ? "url(#arrowHeadActive)" : (isTrav ? "url(#arrowHeadTraversed)" : "url(#arrowHead)")
          );
        }
      }

      function clearStatus(){
        state.nodeStatus = {};
        for(const id of state.nodeEls.keys()){
          setNodeStatus(id, "idle");
          const el = state.nodeEls.get(id);
          const sec = el.querySelector("[data-runsec]");
          if (sec) sec.innerHTML = '<div class="empty">—</div>';
        }
        setEdgeStates(new Set(), new Set());
      }

      function renderRunSection(id, info){
        const el = state.nodeEls.get(id);
        if(!el) return;
        const sec = el.querySelector(`[data-runsec="${CSS.escape(id)}"]`);
        if(!sec) return;
        if(!info || info.status === "idle"){
          sec.innerHTML = '<div class="empty">—</div>';
          return;
        }
        const labels = {
          running: "执行中", done: "已完成", waiting: "等待人工/网页操作",
          retrying: "重试中", failed: "失败", skipped: "未参与",
        };
        const parts = [`<span class="kv">状态: <b>${escapeHtml(labels[info.status] || info.status)}</b></span>`];
        if (info.attempt) parts.push(`<span class="kv">attempt: ${escapeHtml(info.attempt)}</span>`);
        if (info.durationMs != null) parts.push(`<span class="kv">耗时: ${escapeHtml(info.durationMs)}ms</span>`);
        if (info.durations && info.durations.length > 1){
          parts.push(`<span class="kv">历史: ${escapeHtml(info.durations.join(" / "))}ms</span>`);
        }
        let html = `<div class="runline">${parts.join("")}</div>`;
        if (info.status === "waiting" && info.waitingKind){
          const waitLabel = info.waitingKind === "web_file_handshake"
            ? "等待网页导入(文件握手)"
            : "等待人工操作";
          html += `<div class="runWait">${escapeHtml(waitLabel)}${
            info.waitingDetail && info.waitingDetail.checkpoints
              ? " · 关卡 " + escapeHtml(info.waitingDetail.checkpoints.join(" ")) : ""
          }${info.waitingDetail && info.waitingDetail.timeout_s != null ? " · 超时 " + escapeHtml(info.waitingDetail.timeout_s) + "s" : ""}</div>`;
        }
        if (info.lastError){
          const e = info.lastError;
          html += `<div class="runErr">${escapeHtml((e.type ? e.type + ": " : "") + (e.message || ""))}</div>`;
        }
        if (info.lastProgress){
          html += `<div class="small mono">progress: ${escapeHtml(JSON.stringify(info.lastProgress))}</div>`;
        }
        sec.innerHTML = html;
      }

      function refreshExpandedRunSections(monitorState){
        for(const [id, el] of state.nodeEls){
          if (el.classList.contains("collapsed")) continue;
          renderRunSection(id, monitorState.nodes[id]);
        }
      }

      function scrollNodeIntoView(nodeId){
        const el = state.nodeEls.get(nodeId);
        if(!el) return;
        const vpRect = viewport.getBoundingClientRect();
        const r = el.getBoundingClientRect();
        const margin = 80;
        const visible =
          r.left >= vpRect.left + margin && r.right <= vpRect.right - margin &&
          r.top >= vpRect.top + margin && r.bottom <= vpRect.bottom - margin;
        if (visible) return; // 视口内不动(设计 §6.2-F 第 6 条)
        state.programmaticScroll = true;
        const targetLeft = viewport.scrollLeft + (r.left - vpRect.left) - (vpRect.width - r.width) / 2;
        const targetTop = viewport.scrollTop + (r.top - vpRect.top) - (vpRect.height - r.height) / 2;
        viewport.scrollTo({ left: Math.max(0, targetLeft), top: Math.max(0, targetTop), behavior: "smooth" });
        setTimeout(() => { state.programmaticScroll = false; }, 800);
      }

      // 手动滚动暂停跟随
      viewport.addEventListener("wheel", () => {
        const follow = document.getElementById("followChk");
        if (follow && !state.programmaticScroll) follow.checked = false;
      }, { passive: true });

      async function loadData(view){
        const isMain = view === "main";
        setOverlay("Loading…", isMain ? `fetch("${MAIN_API_URL}")` : `fetch("${DEFAULT_DATA_URL}")`, false);

        let data;
        try{
          if (isMain){
            const resp = await fetch(MAIN_API_URL, { cache: "no-store" });
            if(!resp.ok){
              const detail = await resp.text().catch(() => "");
              throw new Error(`HTTP ${resp.status} ${detail.slice(0, 200)}`);
            }
            data = await resp.json();
            // 归一(纯函数在 module 里也有;此处内联轻量版,保证渲染层不依赖 module 加载成功)
            data = window.__wfNormalizeMain
              ? window.__wfNormalizeMain(data)
              : normalizeMainGraphInline(data);
          } else {
            const resp = await fetch(DEFAULT_DATA_URL, { cache: "no-store" });
            if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
            data = await resp.json();
          }
        }catch(err){
          setOverlay("Load failed", [
            isMain ? "无法加载主工作流图(/api/workflow/graph)。"
                   : "Unable to load the JSON file.",
            isMain ? "请确认监控服务在跑(uvicorn monitor_fastapi:app,127.0.0.1:7860);"
                    + "首次调用需在后端构图,可能需要十几秒。"
                   : "If you opened index.html directly (file://), your browser may block fetch().",
            "",
            "Error:",
            String(err)
          ].join("\n"), false);
          return;
        }

        // 主图 TB 布局依赖纯模块;等它就绪(最多 3s),失败时渲染层自行降级横向
        await ensureLayoutModule();
        renderWorkflow(data, view);
      }

      function normalizeMainGraphInline(schema){
        // 与 workflow_monitor.mjs::normalizeMainGraph 同逻辑的渲染层兜底
        const edges = Array.isArray(schema.edges) ? schema.edges : [];
        const ids = new Set(schema.nodes.map(n => n.id));
        const deps = new Map(schema.nodes.map(n => [n.id, new Set()]));
        const nexts = new Map(schema.nodes.map(n => [n.id, new Set()]));
        for (const e of edges){
          if (!ids.has(e.from) || !ids.has(e.to)) continue;
          nexts.get(e.from).add(e.to);
          deps.get(e.to).add(e.from);
        }
        return {
          workflow_meta: {
            id: schema.workflow_id || "auto_video_editor_main",
            name: `完整 LangGraph 工作流(mode=${schema.mode || "?"})`,
            description: `schema v${schema.schema_version} · ${
              Object.entries(schema.flags || {}).map(([k, v]) => `${k}=${v}`).join(", ")
            }`,
          },
          schema_version: schema.schema_version,
          mode: schema.mode,
          edges,
          nodes: schema.nodes.map(n => ({
            ...n,
            dependencies: Array.from(deps.get(n.id) || []),
            next_nodes: Array.from(nexts.get(n.id) || []),
          })),
        };
      }

      function renderWorkflow(data, view){
        state.view = view;
        state.data = data;
        state.workflowId = (data.workflow_meta && data.workflow_meta.id) || "workflow";
        state.schemaVersion = data.schema_version || null;
        state.mode = data.mode || null;
        // 布局 key(第5期阶段1):主图带方向隔离(TB=_tb_v1 / LR=历史格式);
        // 子流程沿用旧 key,布局数据互不影响。
        state.layoutKey = buildLayoutKey();
        state.nodesById = new Map((data.nodes || []).map(n => [n.id, n]));

        wfNameEl.textContent = (data.workflow_meta && data.workflow_meta.name) || "Workflow Node Map";
        wfDescEl.textContent = (data.workflow_meta && data.workflow_meta.description) || "";
        document.title = wfNameEl.textContent;

        // Build nodes:第5期渲染管线 = 建节点 DOM → 应用折叠态 → 测量实际尺寸
        // → 计算坐标(TB 需要真实 offsetWidth/offsetHeight,计划 §6.2 第 6 条)
        const saved = loadLayout();
        state.positionsCustomized = view === "main"
          ? !!(saved && saved.positionsCustomized && saved.positions)
          : false;
        const collapsed = saved?.collapsed || null;
        const useTB = view === "main" && state.direction === "tb";

        // Clear existing nodes but keep svg
        Array.from(canvas.querySelectorAll(".node")).forEach(n => n.remove());
        state.nodeEls.clear();
        removeBandLabel();
        state.layoutResult = null;
        resetCanvasSize();

        for(const node of (data.nodes || [])){
          const el = createNodeEl(node);
          const isCollapsed = collapsed ? !!collapsed[node.id] : true;
          setCollapsed(el, isCollapsed);
          el.style.left = "40px"; // 临时位置,TB 在测量后统一落位
          el.style.top = "40px";

          canvas.appendChild(el);
          state.nodeEls.set(node.id, el);
        }

        if (useTB){
          const customized = state.positionsCustomized;
          const applied = applyTBLayout({ resetCanvas: false, skipPositions: customized });
          if (customized && applied){
            // 用户手动拖拽过:恢复保存坐标(只借 TB 结果做 lane/区带/角色)
            applyHorizontalPositions(saved.positions);
          } else if (!applied){
            // 模块不可用/计算失败:降级横向(保存的或重新计算)
            applyHorizontalPositions(saved?.positions || computeHorizontalPositions(data.nodes || []));
          }
        } else {
          applyHorizontalPositions(saved?.positions || computeHorizontalPositions(data.nodes || []));
        }

        // Make sure the canvas is large enough to contain all nodes before drawing edges.
        ensureCanvasSize();

        // Build edges
        buildEdges();
        // 第5期:标记 TB 布局角色(反馈边虚线 + 侧边 lane)
        markEdgeLayoutRoles();
        // Initial edge layout
        requestAnimationFrame(() => {
          updateAllEdges();
          setOverlay("", "", true);
        });

        state.nodeStatus = {};
        setEdgeStates(new Set(), new Set());
      }

      viewSelect.value = (params.get("view") === "storyline" || params.get("data")) ? "storyline" : "main";
      viewSelect.addEventListener("change", () => {
        const url = new URL(location.href);
        url.searchParams.set("view", viewSelect.value);
        url.searchParams.delete("data");
        history.replaceState(null, "", url);
        loadData(viewSelect.value);
      });

      // Keep edges updated on window resize
      window.addEventListener("resize", () => updateAllEdges());

      // Optional: keep edges updated while scrolling (helps with some browsers/subpixel issues)
      viewport.addEventListener("scroll", () => {
        // Edges are in canvas, so they scroll together, but updating can avoid minor jitter.
        updateAllEdges();
      }, { passive: true });

      // 实时层钩子(module 脚本注入事件;渲染层只做投影)
      window.__wfHooks = {
        setNodeStatus,
        setEdgeStates,
        clearStatus,
        renderRunSection,
        refreshExpandedRunSections,
        scrollNodeIntoView,
        getView: () => state.view,
        getWorkflowId: () => state.workflowId,
        getSchemaEdges: () => (state.data && Array.isArray(state.data.edges)) ? state.data.edges : [],
        getSchemaNodes: () => (state.data && Array.isArray(state.data.nodes)) ? state.data.nodes : [],
      };

      loadData(viewSelect.value);
    })();
  </script>

  <script type="module">
    /* 实时层:订阅 /api/workflow/runs/{thread}/events,把 §7.1 事件经
       workflow_monitor.mjs 的纯归约投到渲染钩子上。断线由 EventSource
       原生重连(自动带 Last-Event-ID),归约层再按 cursor 去重。 */
    const hooks = window.__wfHooks;
    try {
      const wm = await import("/static/workflow_monitor.mjs");
      window.__wfNormalizeMain = wm.normalizeMainGraph;

      const threadInput = document.getElementById("threadInput");
      const btnSub = document.getElementById("btnSubscribe");
      const btnUnsub = document.getElementById("btnUnsubscribe");
      const chip = document.getElementById("runStateChip");
      const countsEl = document.getElementById("runCounts");
      const metaEl = document.getElementById("runMeta");
      const followChk = document.getElementById("followChk");

      const EVENT_TYPES = [
        "snapshot", "store_error",
        "run.started", "run.resumed", "run.interrupted", "run.completed", "run.failed",
        "node.started", "node.succeeded", "node.failed", "node.waiting_input",
        "node.resumed", "node.retrying", "node.progress", "branch.selected",
      ];
      const STATE_LABEL = {
        no_events: "无事件", idle: "空闲", running: "运行中",
        waiting_human: "等待人工操作", completed: "已完成", failed: "失败",
      };

      let monitor = wm.createMonitorState();
      let source = null;
      let threadId = null;

      try { threadInput.value = localStorage.getItem("wf_monitor_thread") || ""; } catch (e) {}

      function setChip(stateKey, extra) {
        chip.className = "s-" + (stateKey || "");
        chip.textContent = (STATE_LABEL[stateKey] || stateKey || "未连接") + (extra ? ` · ${extra}` : "");
      }

      function renderCounts() {
        const c = wm.computeCounts(monitor);
        countsEl.textContent = Object.keys(monitor.nodes).length
          ? `完成 ${c.done} · 执行中 ${c.running} · 等待 ${c.waiting} · 失败 ${c.failed}`
          : "";
      }

      function renderMeta(text, isErr) {
        metaEl.textContent = text || "";
        metaEl.classList.toggle("err", !!isErr);
      }

      function applyProjection() {
        if (hooks.getView() !== "main") return;
        for (const [id, n] of Object.entries(monitor.nodes)) {
          hooks.setNodeStatus(id, n.status, n.attempt);
        }
        const { traversed, active } = wm.edgeStates(hooks.getSchemaEdges(), monitor);
        hooks.setEdgeStates(traversed, active);
        hooks.refreshExpandedRunSections(monitor);
        renderCounts();
        const actives = wm.activeNodeIds(monitor);
        if (followChk.checked && actives.length) {
          hooks.scrollNodeIntoView(actives[0]);
        }
      }

      function handleEvent(esEvent) {
        let data = {};
        try { data = JSON.parse(esEvent.data); } catch (e) { return; }
        // 后端帧是平铺的(payload 字段直接摊在 data 顶层,协议测试锁定);eventFromSse
        // 把它还原成 {…信封字段, payload} —— applyEvent 读 event.payload.xxx(第四期 G1)。
        const event = wm.eventFromSse(esEvent.lastEventId, esEvent.type, data);
        if (esEvent.type === "snapshot") {
          // 快照摘要帧:冷启动基线(事件重放会覆盖细节)
          setChip(data.state || "idle", `count=${data.event_count ?? "?"}`);
          renderMeta(`thread=${data.thread_id || "-"} · cursor=${data.last_id ?? "-"}`);
          return;
        }
        if (esEvent.type === "store_error") {
          setChip("failed", "事件存储不可用");
          renderMeta(String(data.detail || "event store unavailable"), true);
          return;
        }
        const { applied } = wm.applyEvent(monitor, event);
        if (!applied) return;
        setChip(monitor.run.state, monitor.cursor ? `#${monitor.cursor}` : "");
        if (monitor.run.state === "completed" || monitor.run.state === "failed") {
          wm.finalizeSkipped(monitor, hooks.getSchemaNodes());
        }
        applyProjection();
      }

      function subscribe() {
        const tid = (threadInput.value || "").trim();
        if (!tid) { renderMeta("请输入 thread_id", true); return; }
        if (source) source.close();
        threadId = tid;
        try { localStorage.setItem("wf_monitor_thread", tid); } catch (e) {}
        monitor = wm.createMonitorState();
        hooks.clearStatus();
        setChip("running", "连接中…");
        renderMeta(`thread=${tid}`);
        source = new EventSource(wm.API_PATHS.runEvents(tid));
        for (const t of EVENT_TYPES) {
          source.addEventListener(t, handleEvent);
        }
        source.onopen = () => setChip(monitor.run.state || "running", "已连接");
        source.onerror = () => setChip(monitor.run.state || "idle", "重连中…");
      }

      btnSub.addEventListener("click", subscribe);
      btnUnsub.addEventListener("click", () => {
        if (source) { source.close(); source = null; }
        setChip("idle", "已断开");
      });
      threadInput.addEventListener("keydown", (e) => { if (e.key === "Enter") subscribe(); });

      // 渲染层展开节点时补渲染该节点的运行详情(事件可能先于展开到达)
      window.__wfOnExpand = (id) => {
        if (hooks.getView() !== "main") return;
        hooks.renderRunSection(id, monitor.nodes[id]);
      };
    } catch (err) {
      // module 加载失败(如 file:// 打开):静态图仍可用,实时层不可用
      console.warn("workflow_monitor module 不可用,实时层未启用:", err);
    }
  </script>
</body>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-edit-workflow-week2"
version = "0.1.0"
description = "AI 视频剪辑自动化工作流 — 第 2 周 LangGraph 骨架 (节点 1-5 + draft_ops)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Internal" }

dependencies = [
    # 核心编排:从本地源可编辑安装,见 README
    # langgraph==1.2.9
    # langgraph-checkpoint
    # langgraph-prebuilt
    "httpx>=0.27",
    "langgraph-checkpoint-sqlite>=2.0",     # Week 3:SqliteSaver 提供持久化 checkpointer
    "langgraph-checkpoint-postgres>=3.1",  # Week 5:AsyncPostgresSaver 生产路径
    "psycopg[binary,pool]>=3.2",            # Week 5:Postgres 驱动 + 连接池
    "Pillow>=10.0",                         # Week 4:封面 PNG 本地渲染(16:9 / 4:3)
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "playwright>=1.40",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
lint.ignore = ["E501"]
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["nodes", "draft_ops", "mcp_clients"]

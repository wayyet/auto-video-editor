[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-edit-workflow-week2"
version = "0.1.0"
description = "AI 视频剪辑自动化工作流 — 第 2 周 LangGraph 骨架 (节点 1-5 + draft_ops)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Internal" }

dependencies = [
    # 核心编排:从本地源可编辑安装,见 README
    # langgraph==1.2.9
    # langgraph-checkpoint
    # langgraph-prebuilt
    "httpx>=0.27",
    # PostgreSQL 统一改造:运行时唯一持久化后端(方案 §4.8)。
    # SQLite checkpointer 依赖已删除 —— 不再有本地 .sqlite 落盘。
    "langgraph-checkpoint-postgres>=3.1",  # AsyncPostgresSaver / PostgresSaver
    "psycopg[binary,pool]>=3.2",            # Postgres 驱动 + 连接池
    "Pillow>=10.0",                         # Week 4:封面 PNG 本地渲染(16:9 / 4:3)
    "pydantic>=2.0",                        # storyline/contract.py 用
    # 独立监控服务 monitor_fastapi.py(单流水线架构 2026-11-04 阶段1;只读监控)
    # fastapi/uvicorn 钉版与 requirements.txt 保持一致(附件评审 20261105 验收项:依赖清单一致)
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    # 工作流创建台 /api/console/runs multipart 上传解析(第二期阶段 1)
    "python-multipart>=0.0.20,<0.1",
    # 禁止引入:torch / torchaudio / moviepy(ADR-001 进程隔离,不入主环境)
    # 注:`mcp` 仍由 `langgraph-sdk==0.4.4` 间接传递,主环境不再主动声明。
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "playwright>=1.40",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "admin: tests that require local administrator privileges (run with `-m admin`)",
    "slow: tests that exercise real I/O and take more than a few seconds",
    "postgres: tests that require a reachable PostgreSQL (run with `-m postgres`)",
]

[tool.ruff]
lint.ignore = ["E501"]
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["nodes", "draft_ops", "mcp_clients", "storyline", "db"]

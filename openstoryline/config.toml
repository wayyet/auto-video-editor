# ============= 瑙嗛瑙嗚鐞嗚В / Video Visual Understanding =============
[understand_clips]
sample_fps = 2.0                 # 姣忕鎶藉嚑甯?/ Frames sampled per second
max_frames = 64                  # 鍗昪lip鎶藉抚涓婇檺鍏滃簳锛岄伩鍏嶉暱瑙嗛鐖?token / Max frames per clip limit to prevent token overflow

# ============= 闀滃ご鍒嗙粍 / Clip Grouping =============
[group_clips]
base_max_tokens = 28888          # group_clips 鍩虹杈撳嚭 token 棰勭畻锛堥渶瀹圭撼鎺ㄧ悊妯″瀷 <think> 鎬濊€冩锛? Base output token budget for group_clips (must cover reasoning <think> tokens)
tokens_per_clip = 48             # 姣忎釜 clip 棰濆 token 棰勭畻 / Extra output token budget per selected clip
max_tokens_cap = 28888           # token 棰勭畻涓婇檺 / Upper bound of output token budget
retry_token_step = 2048          # 姣忔閲嶈瘯澧炲姞鐨?token 棰勭畻 / Token increase per retry
max_parse_retries = 2            # JSON 瑙ｆ瀽澶辫触鏃堕噸璇曟鏁?/ Retry count when JSON parsing fails


# ============= 妯″瀷閰嶇疆 for user / Model Config for User =============
# 鍙敤妯″瀷 / Available models:
#   MiniMax-M2.7, gpt-5.2, deepseek-v4-flash, deepseek-v4-pro, qwen3.6-flash, qwen3.6-plus, Qwen3.6-27B
# 鍒囨崲妯″瀷鍙渶淇敼 model = "..." 鍗冲彲 / To switch model, just change model = "..."

[llm]
model = "deepseek-v4-pro"
base_url = "https://new-api.ai4c.cn/v1"
api_key = "<YOUR_DEEPSEEK_API_KEY>"

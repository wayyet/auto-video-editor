temperature = 0.1
max_retries = 2

[vlm]
model = "deepseek-v4-pro"
base_url = "https://new-api.ai4c.cn/v1"
api_key = "<YOUR_DEEPSEEK_API_KEY>"
timeout = 120.0 # 鍗曚綅锛氱銆俈LM 璧伴潪娴佸紡璋冪敤锛屾帹鐞嗘ā鍨嬪甫鍥惧嚭 JSON 甯歌秴 20 绉掞紝20 绉掑繀瓒呮椂

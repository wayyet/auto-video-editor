# =========== 缃戠粶涓婚鎼滅储 / Web Topic Search ==========
# 褰撳璇濅腑闇€瑕佲€滃埌缃戜笂灏忕孩涔︽垨鑰呮姈闊虫悳绱㈢浉鍏崇殑涓婚鍜岃祫鏂欌€濇椂锛宻earch_web_topic 鑺傜偣
# 浼氱敤鎼滅储寮曟搸鐨?site: 璇硶鍦ㄤ笅鍒楃珯鐐瑰唴妫€绱紝杩斿洖鏍囬/鎽樿/閾炬帴绛夋枃鏈祫鏂?
[search_web]
sites = ["xiaohongshu.com", "douyin.com"]  # 绔欏唴鎼滅储鐨勭洰鏍囩珯鐐癸紝鍙嚜琛屽鍒狅紙濡?"bilibili.com"锛?
engines = ["ddgs", "bing", "duckduckgo"]   # 鎼滅储寮曟搸浼樺厛绾э紝澶辫触鑷姩鍥為€€涓嬩竴涓紱ddgs 搴撹嚜甯﹀弽鐖吉瑁咃紝瀹炴祴鍥藉唴鐩磋繛鍙敤
results_per_site = 10                      # 姣忎釜绔欑偣鏈€澶氳繑鍥炴潯鏁帮紙涓婇檺 20锛?

# ============= MCP Server 鐩稿叧 / MCP Server Related =============
[local_mcp_server]
server_name = "storyline"
server_cache_dir = ".storyline/.server_cache"
server_transport = "streamable-http"  # server 鍜?host涔嬮棿鐨勪紶杈撴柟寮?/ Transport method between server and host
url_scheme = "http"  
connect_host = "127.0.0.1" # 涓嶈鏀瑰姩 / Do not change
inline_media = "auto"      # 浼犺緭绛栫暐 / Transport policy: auto=鏍规嵁 connect_host 鑷姩閫夋嫨 / auto-detect from connect_host; always=鎬绘槸浣跨敤 base64 / always use base64; never=鎬绘槸鍙敤 path / always use path (e.g. Docker / LAN same-machine)
port = 8001                # 濡傛灉绔彛鍐茬獊锛屽彲浠ラ殢渚跨敤涓€涓湁绌虹殑绔彛 / Use any available port if conflict occurs
path = "/mcp"              # 榛樿鍊硷紝涓€鑸笉鐢ㄦ敼 / Default value, usually unchanged

json_response = true       # 寤鸿鐢?True / Recommended: True
stateless_http = false     # 寮虹儓寤鸿鐢?False / Strongly recommended: False
timeout = 600
available_node_pkgs = [
    "open_storyline.nodes.core_nodes"
]
available_nodes = [
    "LoadMediaNode", "SearchMediaNode", "SearchWebTopicNode", "SplitShotsNode", "LocalASRNode", "SpeechRoughCutNode", "GenerateAITransitionNode",
    "UnderstandClipsNode", "FilterClipsNode", "GroupClipsNode", "GenerateScriptNode", "ScriptTemplateRecomendation",
    "GenerateVoiceoverNode", "SelectBGMNode", "RecommendTransitionNode", "RecommendTextNode",
    "PlanTimelineProNode", "PlanTimelineAITransitionNode", "RenderVideoNode"
]

